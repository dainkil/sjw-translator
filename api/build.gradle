plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'dev.sjw'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:2.0.0"
    }
}

dependencies {
    implementation project(':common')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // /actuator/prometheus (§5.0 1-4) — 레지스트리가 없으면 엔드포인트가 404다
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    // OpenAPI 스펙 + Swagger UI (§5.0 Step 4) — 공개 엔드포인트의 진입점.
    // 2.8.6은 Boot 3 대상이지만 Boot 4.1.1에서 /v3/api-docs·/swagger-ui 모두 200으로 실측 확인했다.
    // BOM이 관리하지 않는 좌표라 버전을 직접 고정한다.
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // 스키마 마이그레이션 (ADR-023). Boot 4는 자동 구성이 기술별 모듈로 분리되어
    // flyway-core만 넣으면 활성화되지 않는다 — starter가 필요하다.
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
