<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1100">
<title>승정원일기 번역 작업대</title>
<!--
  번역가용 작업 화면 (데스크톱 전용). 빌드 도구 없이 Spring static으로 서빙한다 (§7 "프론트엔드 완성도" 배제 —
  프레임워크를 들이지 않고 파일 하나로 끝낸다). API는 같은 오리진의 /api/v1/translations/sync만 쓴다.

  배치는 CAT 도구 관례를 따른다: 왼쪽 문단 표(원문 | 번역 | 상태), 오른쪽 검사 패널(선택 문단의 인명·메모·정보),
  아래 상태 표시줄. 문단 단위 조작(연도·다시 번역·되돌리기)은 검사 패널에 둔다. 화면 언어(한/영)·테마는 토글.

  키 취급 (ADR-020): 요청자 LLM 키(X-Llm-Key)는 기본적으로 메모리에만 둔다. "이 탭에서 기억"을 켤 때만
  sessionStorage에 두고, localStorage에는 어떤 키도 쓰지 않는다. 작업 내용(원문·번역·검토 표시)과
  화면 설정(언어·테마·독음)만 localStorage에 저장한다.

  글꼴은 CDN에서 받되 없어도 시스템 글꼴로 동작한다 (Pretendard / Noto Serif KR / JetBrains Mono).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Serif+KR:wght@400;600&display=swap">
<style>
:root, :root[data-theme="dark"] {
  --bg: #09090b;
  --s1: #0f1013;
  --s2: #15161a;
  --s3: #1c1d22;
  --hover: rgba(255,255,255,.035);
  --line: rgba(255,255,255,.07);
  --line-2: rgba(255,255,255,.12);
  --t1: #ececef;
  --t2: #a0a1a9;
  --t3: #6b6c75;
  --accent: #ff5f3a;
  --accent-soft: rgba(255,95,58,.12);
  --accent-ink: #fff;
  --ok: #3fcf8e;
  --warn: #f2b13d;
  --bad: #ff5c62;
  --info: #6aa2ff;
  --bad-soft: rgba(255,92,98,.12);
  --sel: rgba(242,177,61,.18);
  --shadow: 0 16px 48px rgba(0,0,0,.5), 0 0 0 1px var(--line-2);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f4f4f5;
  --s1: #ffffff;
  --s2: #fafafa;
  --s3: #f1f1f3;
  --hover: rgba(0,0,0,.03);
  --line: rgba(0,0,0,.08);
  --line-2: rgba(0,0,0,.14);
  --t1: #18181b;
  --t2: #5b5c66;
  --t3: #8c8d96;
  --accent: #e8461f;
  --accent-soft: rgba(232,70,31,.09);
  --accent-ink: #fff;
  --ok: #128a52;
  --warn: #b97700;
  --bad: #d92d33;
  --info: #2f6fe0;
  --bad-soft: rgba(217,45,51,.08);
  --sel: rgba(185,119,0,.16);
  --shadow: 0 16px 48px rgba(0,0,0,.14), 0 0 0 1px var(--line-2);
  color-scheme: light;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body {
  min-width: 1100px;
  display: grid; grid-template-rows: 52px 40px 1fr 30px;
  background: var(--bg); color: var(--t1);
  font: 13px/1.5 "Pretendard Variable", Pretendard, "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased; letter-spacing: -0.005em;
}
.hanmun { font-family: "Noto Serif KR", "Noto Serif CJK KR", "Source Han Serif K", "Batang", serif; }
.mono, kbd { font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; font-feature-settings: "zero" 0; }
button, input, textarea, select { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 4px; }
svg.i { width: 15px; height: 15px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ── 상단 바 ── */
.top {
  display: flex; align-items: center; gap: 4px; padding: 0 12px 0 16px;
  background: var(--s1); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: 18px; white-space: nowrap; }
.brand .mark { font-size: 17px; font-weight: 600; letter-spacing: .02em; }
.brand .sub { font-size: 11px; color: var(--t3); letter-spacing: .14em; text-transform: uppercase; }
.spacer { flex: 1; }
.vsep { width: 1px; height: 20px; background: var(--line-2); margin: 0 6px; }
.btn {
  display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px;
  border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--t2);
  cursor: pointer; white-space: nowrap; transition: background .12s, color .12s, border-color .12s;
}
.btn:hover:not(:disabled) { background: var(--hover); color: var(--t1); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.outline { border-color: var(--line-2); color: var(--t1); }
.btn.primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; padding: 0 12px; }
.btn.primary:hover:not(:disabled) { background: var(--accent); color: var(--accent-ink); filter: brightness(1.08); }
.btn.primary kbd { background: rgba(255,255,255,.18); border-color: transparent; color: inherit; }
.btn.sm { height: 26px; padding: 0 8px; font-size: 12px; border-radius: 6px; }
a.btn { text-decoration: none; }
.seg-ctl { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--s3); border: 1px solid var(--line); }
.seg-ctl button {
  height: 24px; min-width: 32px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent;
  color: var(--t3); cursor: pointer; font-size: 12px; font-weight: 500;
}
.seg-ctl button[aria-pressed="true"] { background: var(--s1); color: var(--t1); box-shadow: 0 1px 2px rgba(0,0,0,.25), 0 0 0 1px var(--line); }
kbd {
  display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px;
  border-radius: 4px; border: 1px solid var(--line-2); background: var(--s2);
  font-size: 10.5px; color: var(--t2); line-height: 1;
}

/* ── 걸러 보기 ── */
.bar {
  display: flex; align-items: center; gap: 2px; padding: 0 12px;
  background: var(--s1); border-bottom: 1px solid var(--line);
}
.tab {
  position: relative; display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 10px;
  border: 0; background: transparent; color: var(--t3); cursor: pointer; font-weight: 500;
}
.tab:hover:not(:disabled) { color: var(--t1); }
.tab .n { font-size: 11px; color: var(--t3); font-variant-numeric: tabular-nums; }
.tab[aria-pressed="true"] { color: var(--t1); }
.tab[aria-pressed="true"]::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent); }
.tab .dot { width: 6px; height: 6px; border-radius: 50%; }
.tab:disabled { opacity: .35; cursor: default; }
.switch { display: inline-flex; align-items: center; gap: 8px; color: var(--t2); cursor: pointer; font-size: 12px; }
.switch input { appearance: none; width: 28px; height: 16px; border-radius: 9px; background: var(--s3); border: 1px solid var(--line-2); position: relative; cursor: pointer; transition: background .15s; margin: 0; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: var(--t2); transition: transform .15s, background .15s; }
.switch input:checked { background: var(--accent); border-color: var(--accent); }
.switch input:checked::after { transform: translateX(12px); background: #fff; }

/* ── 작업 영역 ── */
.work { display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 0; }
.grid { display: flex; flex-direction: column; min-height: 0; background: var(--bg); }
.cols, .seg { display: grid; grid-template-columns: 48px minmax(0, 1fr) minmax(0, 1fr) 128px; }
.cols { height: 30px; align-items: center; border-bottom: 1px solid var(--line); color: var(--t3); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
.cols > div { padding: 0 14px; }
.cols > div:first-child { text-align: right; padding-right: 12px; }
#segments { overflow-y: auto; flex: 1; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }

.seg { position: relative; border-bottom: 1px solid var(--line); transition: background .12s; }
.seg:hover { background: var(--hover); }
.seg.active { background: var(--s1); }
.seg.active::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent); }
.seg .num { padding: 14px 12px 0 0; text-align: right; color: var(--t3); font-size: 11px; }
.seg.active .num { color: var(--accent); }
.seg .src { padding: 10px 14px 12px; font-size: 17px; line-height: 2.25; word-break: break-all; color: var(--t1); }
.seg .tgt { display: flex; position: relative; border-left: 1px solid var(--line); }
.seg textarea {
  flex: 1; width: 100%; min-height: 60px; resize: none; border: 0; background: transparent;
  padding: 13px 14px; font-size: 14.5px; line-height: 1.75; color: var(--t1);
}
.seg textarea:focus { outline: none; }
.seg.active textarea:focus { background: var(--s2); }
.seg textarea::placeholder { color: var(--t3); }
.seg .st { padding: 12px 12px; display: flex; flex-direction: column; gap: 5px; font-size: 12px; border-left: 1px solid var(--line); }
.st .l { display: flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--t2); }
.st .d { width: 6px; height: 6px; border-radius: 50%; background: var(--t3); flex: none; }
.chk { display: inline-flex; align-items: center; gap: 7px; cursor: pointer; color: var(--t3); }
.chk input {
  appearance: none; width: 15px; height: 15px; margin: 0; border-radius: 4px; border: 1.5px solid var(--line-2);
  display: grid; place-items: center; cursor: pointer; transition: background .12s, border-color .12s;
}
.chk input::after { content: ""; width: 7px; height: 4px; border-left: 1.6px solid #fff; border-bottom: 1.6px solid #fff; transform: rotate(-45deg) translate(1px,-1px); opacity: 0; }
.chk input:checked { background: var(--ok); border-color: var(--ok); }
.chk input:checked::after { opacity: 1; }
.chk.on { color: var(--ok); }

.seg.loading .tgt::after {
  content: ""; position: absolute; left: 14px; top: 20px; width: 40%; height: 8px; border-radius: 4px;
  background: linear-gradient(90deg, var(--s3), var(--line-2), var(--s3)); background-size: 200% 100%;
  animation: sh 1.2s linear infinite;
}
.seg.loading textarea { color: transparent; }
@keyframes sh { from { background-position: 200% 0; } to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .seg.loading .tgt::after { animation: none; } }

.c-ok { color: var(--ok); } .c-warn { color: var(--warn); } .c-bad { color: var(--bad); } .c-info { color: var(--info); } .c-mute { color: var(--t3); }
.b-ok { background: var(--ok) !important; } .b-warn { background: var(--warn) !important; } .b-bad { background: var(--bad) !important; } .b-info { background: var(--info) !important; }

/* 원문 속 인명 */
mark.ent { background: transparent; color: inherit; cursor: pointer; padding: 0 1px; border-radius: 2px; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 6px; text-decoration-color: var(--line-2); }
mark.ent.ok { text-decoration-color: var(--ok); }
mark.ent.miss { text-decoration-color: var(--warn); text-decoration-style: dashed; }
mark.ent.amb { text-decoration-color: var(--info); text-decoration-style: dotted; }
mark.ent.lost { text-decoration-color: var(--bad); background: var(--bad-soft); }
mark.ent.sel { background: var(--sel); }
ruby.reading { ruby-position: over; }
ruby.reading rt {
  font-family: "Pretendard Variable", Pretendard, "Malgun Gothic", system-ui, sans-serif;
  font-size: 10.5px; line-height: 1; color: var(--ok); font-weight: 600; letter-spacing: .02em; opacity: .9;
}
ruby.reading.lost rt { color: var(--bad); }
.hide-reading ruby.reading rt { display: none; }

.empty { display: grid; place-items: center; height: 100%; padding: 40px; }
.empty .box { max-width: 460px; text-align: center; }
.empty .glyph { font-size: 44px; color: var(--t3); margin-bottom: 14px; }
.empty h2 { margin: 0 0 6px; font-size: 16px; font-weight: 600; }
.empty p { margin: 0 0 18px; color: var(--t2); }
.empty .acts { display: flex; gap: 8px; justify-content: center; }
.filter-empty { padding: 24px 16px; color: var(--t3); }

/* ── 검사 패널 ── */
.insp { overflow-y: auto; min-height: 0; background: var(--s1); border-left: 1px solid var(--line); scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
.sec { padding: 16px 18px; border-bottom: 1px solid var(--line); }
.sec > h3 { margin: 0 0 10px; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--t3); display: flex; gap: 8px; }
.sec > h3 .n { color: var(--t2); letter-spacing: 0; }
.big { font-size: 15px; font-weight: 600; margin: -2px 0 10px; }
.note { color: var(--t3); }
.kv { display: grid; grid-template-columns: 84px 1fr; gap: 6px 10px; margin: 0; }
.kv dt { color: var(--t3); }
.kv dd { margin: 0; word-break: break-all; color: var(--t1); }
.input { height: 26px; width: 84px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--s2); }
.actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
.err { margin-top: 12px; padding: 8px 10px; border-radius: 7px; background: var(--bad-soft); color: var(--bad); }

.ents { display: grid; gap: 2px; margin: 0 -8px; }
/* 원문 속 mark.ent와 클래스가 겹치므로 반드시 .ents 아래로 한정한다 */
.ents > .ent { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px; padding: 7px 8px; border-radius: 7px; cursor: pointer; }
.ents > .ent:hover { background: var(--hover); }
.ents > .ent.sel { background: var(--s3); }
.ents .h { font-size: 16px; }
.ents .k { margin-left: 8px; font-weight: 600; }
.ents .s { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--t2); }
.ents .s .d { width: 6px; height: 6px; border-radius: 50%; }
.ents .det { grid-column: 1 / -1; font-size: 12px; color: var(--t3); padding-top: 4px; }
.ents .det .btn { margin-top: 8px; }

.keys { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center; color: var(--t2); }
.keys > span:nth-child(odd) { display: inline-flex; gap: 3px; }
.legend { display: grid; gap: 8px; margin-top: 14px; color: var(--t2); }
.legend > span { display: flex; align-items: baseline; }
.legend .hanmun { font-size: 14px; margin-right: 8px; }

/* ── 상태 표시줄 ── */
.status {
  display: flex; align-items: center; gap: 16px; padding: 0 16px;
  background: var(--s1); border-top: 1px solid var(--line);
  font-size: 11.5px; color: var(--t3); white-space: nowrap; overflow: hidden;
}
.status .msg { flex: 1; overflow: hidden; text-overflow: ellipsis; color: var(--t2); transition: color .3s; }
.status .msg.flash { color: var(--accent); }
.meter { width: 120px; height: 3px; border-radius: 2px; background: var(--s3); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .3s; }
.status .k { display: inline-flex; align-items: center; gap: 5px; }
.status .k .d { width: 6px; height: 6px; border-radius: 50%; background: var(--t3); }

/* ── 대화상자 ── */
dialog {
  border: 0; border-radius: 14px; padding: 0; width: 640px;
  background: var(--s1); color: var(--t1); box-shadow: var(--shadow);
}
dialog::backdrop { background: rgba(0,0,0,.45); backdrop-filter: blur(3px); }
dialog header { padding: 18px 20px 6px; font-size: 15px; font-weight: 600; }
dialog .content { padding: 10px 20px 4px; display: grid; gap: 14px; }
dialog footer { padding: 16px 20px 18px; display: flex; gap: 8px; align-items: center; }
.field { display: grid; gap: 6px; }
.field > span { font-size: 12px; font-weight: 500; color: var(--t2); }
.hint { color: var(--t3); font-size: 12px; }
.field input[type=text], .field input[type=password], .field input[type=number], .field textarea {
  width: 100%; border: 1px solid var(--line-2); border-radius: 8px; background: var(--s2); padding: 8px 10px;
  transition: border-color .12s;
}
.field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
.field textarea { min-height: 240px; resize: vertical; font-size: 15px; line-height: 1.85; }
.row { display: flex; gap: 10px; align-items: center; }
.radio { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--line-2); cursor: pointer; }
.radio:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.radio input { accent-color: var(--accent); margin: 0; }

.drop {
  position: fixed; inset: 12px; z-index: 40; display: grid; place-items: center; border-radius: 16px;
  background: color-mix(in srgb, var(--bg) 80%, transparent); backdrop-filter: blur(4px);
  border: 1.5px dashed var(--accent); font-size: 15px; color: var(--t1); pointer-events: none;
}
</style>
</head>

<header class="top">
  <div class="brand"><span class="mark hanmun">承政院日記</span><span class="sub" data-i18n="sub"></span></div>

  <a class="btn" href="/swagger-ui.html" target="_blank" rel="noopener"><svg class="i"><use href="#i-doc"/></svg>API</a>

      'err.LLM_UPSTREAM_ERROR': 'Temporary model error', 'err.LLM_MODEL_UNAVAILABLE': 'Model unavailable', 'err.LLM_PARSE_ERROR': 'Could not parse the response',
      tsvHead: ['No', 'Year', 'Source', 'Translation', 'Machine translation', 'Edited', 'Confirmed', 'Name check', 'Confirmed names', 'Names to check'],
      tsvGrade: { ok: 'present', review: 'check', lost: 'missing' },
      file: { txt: 'sjw_translation', pair: 'sjw_parallel', tsv: 'sjw_table' },
    },
  };
  // 다시 눌러도 같은 결과일 오류 — 전체 번역을 멈춘다.
  const HALTING = new Set(['API_KEY_REQUIRED', 'UNKNOWN_API_KEY', 'BYOK_REQUIRED', 'TENANT_DAILY_LIMIT',
    'LLM_QUOTA_DAILY', 'LLM_SPEND_CAP', 'LLM_KEY_REJECTED', 'LLM_RATE_LIMITED']);
  const STAGE_CLS = { SINGLE: 'ok', TIME: 'ok', OFFICE: 'ok', AMBIGUOUS: 'info', MISS: 'warn' };

  // ── 상태 ──
  let state = { segments: [], selected: null, selEnt: null, filter: 'all' };
  let keys = { api: '', llm: '', remember: false };
  let prefs = { reading: true, lang: 'ko', theme: 'dark' };
  let running = null; // { abort: AbortController }

  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Math.random().toString(36).slice(2, 10);
  function t(k, ...a) {
    const v = I18N[prefs.lang]?.[k] ?? I18N.ko[k];
    return typeof v === 'function' ? v(...a) : (v ?? k);
  }
  // 오류는 코드로 저장하고 표시할 때 현재 언어로 바꾼다 — 언어를 바꿔도 옛 문구가 남지 않게.
  function errText(err) {
    if (!err) return '';
    let s = I18N[prefs.lang][`err.${err.code}`] ? t(`err.${err.code}`)
      : err.code === 'NETWORK' ? t('network') : err.status === 400 ? t('badReq') : t('serverErr', err.status || '');
    if (err.limit) s += t('limitSfx', err.limit);
    if (err.retry) s += t('retrySfx', err.retry);
    return s;
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORE);
      if (raw) {
        const s = JSON.parse(raw);
        state.segments = (s.segments || []).map((g) => ({ ...g, status: g.status === 'loading' ? 'idle' : g.status }));
        state.selected = s.selected || null;
      }
    } catch (_) { /* 저장소 없음 — 빈 작업으로 시작 */ }
    try {
      const raw = sessionStorage.getItem(KEYSTORE);
      if (raw) keys = { ...JSON.parse(raw), remember: true };
    } catch (_) { /* 무시 */ }
    try {
      const raw = localStorage.getItem(PREFS);
      if (raw) prefs = { ...prefs, ...JSON.parse(raw) };
    } catch (_) { /* 기본값으로 */ }
  }
  let saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try {
        localStorage.setItem(STORE, JSON.stringify({ segments: state.segments, selected: state.selected }));
      } catch (_) { /* 저장 실패해도 작업은 계속 */ }
    }, 300);
  }
  function saveKeys() {
    try {
      if (keys.remember) sessionStorage.setItem(KEYSTORE, JSON.stringify({ api: keys.api, llm: keys.llm }));
      else sessionStorage.removeItem(KEYSTORE);
    } catch (_) { /* 무시 */ }
  }
  function savePrefs() {
    try { localStorage.setItem(PREFS, JSON.stringify(prefs)); } catch (_) { /* 무시 */ }
  }

  // ── 원문 분할 ──
  function splitSource(raw) {
    const out = [];
    for (const line of raw.replace(/\r/g, '').split('\n')) {
      for (const part of line.split(/(?=○)/)) {
        const s0 = part.trim();
        if (!s0 || s0 === '○') continue;
        if (s0.length <= MAX_CHARS) { out.push(s0); continue; }
        let buf = '';
        for (const s of s0.split(/(?<=。)/)) {
          if ((buf + s).length > MAX_CHARS && buf) { out.push(buf); buf = ''; }
          buf += s;
          while (buf.length > MAX_CHARS) { out.push(buf.slice(0, MAX_CHARS)); buf = buf.slice(MAX_CHARS); }
        }
        if (buf) out.push(buf);
      }
    }
    return out;
  }

  function newSegment(src, year) {
    return { id: uid(), src, year: year || null, out: '', mt: '', status: 'idle', error: null,
      entities: [], notes: [], meta: null, reviewed: false };
  }

  // ── 인명 점검 (서버 QualityGate.nameReflected와 같은 규칙) ──
  function nameReflected(text, name) {
    if (!text || !name) return false;
    if (text.includes(name)) return true;
    const given = name.length >= 3 ? name.slice(1) : null;
    return !!given && given.length >= 2 && text.includes(given);
  }
  function uniqueEntities(seg) {
    const seen = new Map();
    for (const e of seg.entities || []) if (!seen.has(e.surface)) seen.set(e.surface, e);
    return [...seen.values()];
  }
  function isConfirmed(e) { return !!(e.kbId && e.resolvedName); }
  function check(seg) {
    const ents = uniqueEntities(seg).filter((e) => e.type === 'PER');
    const confirmed = ents.filter(isConfirmed);
    const missing = confirmed.filter((e) => !nameReflected(seg.out, e.resolvedName));
    const miss = ents.filter((e) => e.linkStage === 'MISS');
    const amb = ents.filter((e) => e.ambiguous);
    let grade = null;
    if (seg.status === 'done' || seg.out) {
      grade = missing.length ? 'lost' : (miss.length || amb.length) ? 'review' : 'ok';
    }
    return { confirmed, missing, miss, amb, grade };
  }

  // ── API ──
  async function translate(seg, signal) {
    const headers = { 'Content-Type': 'application/json', 'Accept': 'application/json' };
    if (keys.api) headers['X-Api-Key'] = keys.api;
    if (keys.llm) headers['X-Llm-Key'] = keys.llm;
    const body = { text: seg.src };
    if (seg.year) body.year = Number(seg.year);
    let res;
    try {
      res = await fetch(API, { method: 'POST', headers, body: JSON.stringify(body), signal });
    } catch (e) {
      if (e.name === 'AbortError') throw e;
      throw { code: 'NETWORK' };
    }
    let data = null;
    try { data = await res.json(); } catch (_) { /* 본문 없음 */ }
    if (!res.ok) {
      throw { code: data && data.error || ('HTTP_' + res.status), status: res.status,
        limit: data && data.dailyCallLimit, retry: data && data.retryAfterSeconds };
    }
    return data;
  }

  async function runOne(seg, signal) {
    seg.status = 'loading'; seg.error = null;
    renderSeg(seg);
    if (seg.id === state.selected) renderSide();
    try {
      const r = await translate(seg, signal);
      const edited = seg.out && seg.out !== seg.mt;
      seg.mt = r.translatedText || '';
      if (!edited) seg.out = seg.mt;
      seg.entities = r.entities || [];
      seg.notes = (r.uncertainSpans || []);
      seg.meta = r.meta || null;
      seg.status = 'done';
      if (edited) message(t('msgEditedKept', num(seg)));
    } catch (e) {
      if (e && e.name === 'AbortError') { seg.status = seg.mt ? 'done' : 'idle'; }
      else { seg.status = 'error'; seg.error = e; }
    }
    renderSeg(seg);
    renderSide(); renderProgress(); applyFilter(); save();
    return seg.status === 'error' ? seg.error : null;
  }

  async function runAll() {
    if (running) return;
    const todo = state.segments.filter((s) => s.status !== 'done');
    if (!todo.length) { message(t('msgNothing')); return; }
    running = { abort: new AbortController() };
    renderToolbar();
    for (const seg of todo) {
      if (running.abort.signal.aborted) break;
      select(seg.id, false);
      const err = await runOne(seg, running.abort.signal);
      if (err && HALTING.has(err.code)) {
        message(t('msgHalted', num(seg), errText(err)));
        if (['BYOK_REQUIRED', 'API_KEY_REQUIRED', 'UNKNOWN_API_KEY', 'LLM_KEY_REJECTED'].includes(err.code)) openSettings();
        break;
      }
    }
    running = null;
    renderToolbar();
  }

  // ── 렌더링 ──
  function highlight(seg) {
    const ents = uniqueEntities(seg);
    const html = esc(seg.src);
    if (!ents.length) return html;
    const lost = new Set(check(seg).missing.map((e) => e.surface));
    const sorted = [...ents].sort((a, b) => b.surface.length - a.surface.length);
    const re = new RegExp(sorted.map((e) => esc(e.surface).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'g');
    const bySurface = new Map(ents.map((e) => [esc(e.surface), e]));
    return html.replace(re, (m) => {
      const e = bySurface.get(m);
      let cls = '';
      if (e.type === 'PER') {
        cls = lost.has(e.surface) ? 'lost' : isConfirmed(e) ? 'ok' : e.ambiguous ? 'amb' : e.linkStage === 'MISS' ? 'miss' : '';
      }
      const sel = state.selected === seg.id && state.selEnt === e.surface ? ' sel' : '';
      const title = e.type === 'PER' ? (e.resolvedName ? `${e.resolvedName} · ${e.kbId}` : t(`stage.${e.linkStage}`)) : (e.type === 'LOC' ? t('eLoc') : e.type);
      const markHtml = `<mark class="ent ${cls}${sel}" data-ent="${esc(e.surface)}" title="${esc(title)}">${m}</mark>`;
      // KB가 확정한 이름만 독음을 단다 — 후보·미등재는 번역가가 판단할 몫이라 답처럼 보이게 하지 않는다
      return isConfirmed(e) ? `<ruby class="reading ${cls}">${markHtml}<rt>${esc(e.resolvedName)}</rt></ruby>` : markHtml;
    });
  }

  // ── 걸러 보기 ──
  const FILTERS = [
    { key: 'all', label: 'fAll', test: () => true },
    { key: 'todo', label: 'fTodo', test: (s) => !s.out },
    { key: 'lost', label: 'fLost', dot: 'bad', test: (s) => check(s).grade === 'lost' },
    { key: 'review', label: 'fReview', dot: 'warn', test: (s) => check(s).grade === 'review' },
    { key: 'unreviewed', label: 'fUnrev', test: (s) => !s.reviewed },
  ];
  function passes(seg) { return (FILTERS.find((f) => f.key === state.filter) || FILTERS[0]).test(seg); }
  // 걸러 보기는 필터를 바꿀 때·번역이 끝날 때만 다시 적용한다 — 고치는 중인 문단이 손 밑에서 사라지지 않게.
  function applyFilter() {
    let shown = 0;
    for (const seg of state.segments) {
      const el = document.querySelector(`.seg[data-id="${seg.id}"]`);
      if (!el) continue;
      el.hidden = !passes(seg);
      if (!el.hidden) shown++;
    }
    const note = $('#filter-empty');
    if (note) note.hidden = shown > 0 || !state.segments.length;
  }

  function line(dotCls, text, title) {
    return `<span class="l"${title ? ` title="${esc(title)}"` : ''}><span class="d ${dotCls}"></span>${text}</span>`;
  }
  function statusCell(seg) {
    const c = check(seg);
    let s;
    if (seg.status === 'loading') s = line('b-info', t('stLoading'));
    else if (seg.status === 'error') s = line('b-bad', `<span class="c-bad">${t('stFailed')}</span>`, errText(seg.error));
    else if (!seg.out) s = line('', `<span class="c-mute">${t('stTodo')}</span>`);
    else s = line('b-ok', seg.mt && seg.out !== seg.mt ? `${t('stDone')} · ${t('stEdited')}` : t('stDone'));
    let names = '';
    if (c.grade === 'lost') names = line('b-bad', `<span class="c-bad">${t('nLost', c.missing.length)}</span>`);
    else if (c.grade === 'review') names = line('b-warn', `<span class="c-warn">${t('nReview', c.miss.length + c.amb.length)}</span>`);
    else if (c.grade === 'ok' && c.confirmed.length) names = line('b-ok', t('nOk', c.confirmed.length));
    const cached = seg.meta && seg.meta.cacheHit ? `<span class="l c-mute">${t('stCached')}</span>` : '';
    return `${s}${names}${cached}
      <label class="chk ${seg.reviewed ? 'on' : ''}" style="margin-top:4px"><input type="checkbox" data-role="reviewed" ${seg.reviewed ? 'checked' : ''}>${t('stReview')}</label>`;
  }

  function segHtml(seg, i) {
    return `
      <div class="num mono">${String(i + 1).padStart(2, '0')}</div>
      <div class="src hanmun" lang="zh-Hant">${highlight(seg)}</div>
      <div class="tgt"><textarea rows="2" data-role="out" aria-label="${i + 1}" placeholder="${seg.status === 'loading' ? '' : esc(t('ph'))}">${esc(seg.out)}</textarea></div>
      <div class="st">${statusCell(seg)}</div>`;
  }

  function renderSeg(seg) {
    const el = document.querySelector(`.seg[data-id="${seg.id}"]`);
    if (!el) return renderSegments();
    const hadFocus = document.activeElement && el.contains(document.activeElement) && document.activeElement.dataset.role === 'out';
    const caret = hadFocus ? document.activeElement.selectionStart : null;
    el.className = `seg${state.selected === seg.id ? ' active' : ''}${seg.status === 'loading' ? ' loading' : ''}`;
    el.innerHTML = segHtml(seg, state.segments.indexOf(seg));
    const ta = el.querySelector('textarea');
    autosize(ta);
    if (hadFocus) { ta.focus(); ta.setSelectionRange(caret, caret); }
  }

  // 입력 중에는 textarea를 다시 그리지 않는다 — 원문 강조와 상태 칸만 갱신.
  function refreshSegChrome(seg) {
    const el = document.querySelector(`.seg[data-id="${seg.id}"]`);
    if (!el) return;
    el.querySelector('.src').innerHTML = highlight(seg);
    el.querySelector('.st').innerHTML = statusCell(seg);
  }

  function renderSegments() {
    const box = $('#segments');
    $('#cols').hidden = !state.segments.length;
    if (!state.segments.length) {
      box.innerHTML = `
        <div class="empty"><div class="box">
          <div class="glyph hanmun">譯</div>
          <h2>${t('emptyTitle')}</h2>
          <p>${t('emptyBody')}</p>
          <div class="acts">
            <button class="btn primary" type="button" data-act="import"><svg class="i"><use href="#i-import"/></svg>${t('import')}</button>
            <button class="btn outline" type="button" data-act="sample">${t('sample')}</button>
          </div>
        </div></div>`;
      return;
    }
    box.innerHTML = state.segments.map((seg) => `<div class="seg" data-id="${seg.id}"></div>`).join('')
      + `<div class="filter-empty" id="filter-empty" hidden>${t('filterEmpty')}</div>`;
    state.segments.forEach(renderSeg);
    applyFilter();
  }

  function renderFilters() {
    const box = $('#filters');
    if (!state.segments.length) { box.innerHTML = ''; return; }
    box.innerHTML = FILTERS.map((f) => {
      const n = state.segments.filter(f.test).length;
      const on = state.filter === f.key;
      const dot = f.dot && n ? `<span class="dot b-${f.dot}"></span>` : '';
      return `<button type="button" class="tab" data-filter="${f.key}" aria-pressed="${on}" ${!n && !on && f.key !== 'all' ? 'disabled' : ''}>${dot}${t(f.label)}<span class="n mono">${n}</span></button>`;
    }).join('');
  }

  function renderSide() {
    const seg = current();
    const segBox = $('#seg-panel'), entBox = $('#ent-panel'), noteBox = $('#note-panel'), metaBox = $('#meta-panel');
    if (!seg) {
      $('#ent-count').textContent = ''; $('#note-count').textContent = '';
      segBox.innerHTML = `<span class="note">${t('noSel')}</span>`;
      entBox.innerHTML = noteBox.innerHTML = metaBox.innerHTML = '<span class="note">—</span>';
      return;
    }
    const edited = seg.mt && seg.out !== seg.mt;
    segBox.innerHTML = `
      <div class="big">${t('segN', num(seg))}</div>
      <dl class="kv">
        <dt>${t('year')}</dt><dd><input class="input mono" type="number" data-role="seg-year" value="${esc(seg.year || '')}" min="1392" max="1910"> <span class="c-mute" id="seg-reign">${esc(reignLabel(seg.year))}</span></dd>
        <dt>${t('chars')}</dt><dd class="mono">${seg.src.length}</dd>
      </dl>
      <div class="actions">
        <button class="btn outline sm" type="button" data-act="run" ${seg.status === 'loading' || running ? 'disabled' : ''}><svg class="i"><use href="#i-redo"/></svg>${seg.status === 'done' ? t('rerun') : t('run')}<kbd>Alt</kbd><kbd>↵</kbd></button>
        <button class="btn outline sm" type="button" data-act="copy" ${seg.out ? '' : 'disabled'}><svg class="i"><use href="#i-copy"/></svg>${t('copy')}</button>
        ${edited ? `<button class="btn outline sm" type="button" data-act="revert"><svg class="i"><use href="#i-undo"/></svg>${t('revert')}</button>` : ''}
      </div>
      ${seg.status === 'error' ? `<div class="err">${esc(errText(seg.error))}</div>` : ''}`;

    const ents = uniqueEntities(seg);
    $('#ent-count').textContent = ents.length ? String(ents.length) : '';
    if (!ents.length) {
      entBox.innerHTML = `<span class="note">${seg.status === 'done' ? t('noEnts') : t('afterTr')}</span>`;
    } else {
      const order = (e) => e.type !== 'PER' ? 4 : isConfirmed(e) && !nameReflected(seg.out, e.resolvedName) ? 0 : e.linkStage === 'MISS' ? 1 : e.ambiguous ? 2 : 3;
      entBox.innerHTML = `<div class="ents">${[...ents].sort((a, b) => order(a) - order(b)).map((e) => entRow(seg, e)).join('')}</div>`;
    }

    const notes = seg.notes || [];
    $('#note-count').textContent = notes.length ? String(notes.length) : '';
    noteBox.innerHTML = notes.length
      ? `<div style="display:grid;gap:6px">${notes.map((n) => `<div><span class="hanmun" style="font-size:15px">${esc(n.text)}</span> <span class="${n.reason === 'KB_MISS' ? 'c-warn' : 'c-mute'}" style="margin-left:6px">${esc(n.reason === 'KB_MISS' ? t('kbMiss') : (n.reason || t('uncertain')))}</span></div>`).join('')}</div>`
      : `<span class="note">${seg.status === 'done' ? t('none') : t('afterTr')}</span>`;

    const m = seg.meta;
    if (!m) { metaBox.innerHTML = `<span class="note">${t('beforeTr')}</span>`; return; }
    const lat = Object.entries(m.latencyMs || {}).map(([k, v]) => `${t(`lat.${k}`)} ${v}`).join(' · ');
    metaBox.innerHTML = `
      <dl class="kv">
        <dt>${t('mModel')}</dt><dd class="mono">${esc(m.model || '—')}</dd>
        <dt>${t('mSource')}</dt><dd>${m.cacheHit ? (m.cacheHit === 'L2_TEMPLATE' ? t('mL2') : t('mL1')) : t('mNew')}</dd>
        ${m.tokensIn != null ? `<dt>${t('mTokens')}</dt><dd class="mono">${m.tokensIn} → ${m.tokensOut ?? '—'}</dd>` : ''}
        <dt>${t('mTime')}</dt><dd class="mono">${esc(lat || '—')}</dd>
        <dt>${t('mKb')}</dt><dd class="mono">${esc(m.kbVersion || '—')}</dd>
        <dt>${t('mPrompt')}</dt><dd class="mono">${esc(m.promptVersion || '—')}</dd>
      </dl>`;
  }

  function entRow(seg, e) {
    const sel = state.selEnt === e.surface;
    const pct = Math.round((e.confidence || 0) * 100);
    let s, det = '';
    if (e.type !== 'PER') {
      s = `<span class="s">${t('eLoc')}</span>`;
    } else if (isConfirmed(e)) {
      const reflected = nameReflected(seg.out, e.resolvedName);
      s = reflected ? `<span class="s"><span class="d b-ok"></span>${t('eIn')}</span>`
        : seg.out ? `<span class="s c-bad"><span class="d b-bad"></span>${t('eOut')}</span>` : '<span class="s">—</span>';
      if (sel) {
        det = `<span class="mono">${esc(e.kbId)}</span> · ${esc(t(`stage.${e.linkStage}`))} · ${t('eNer')} ${pct}%`;
        if (!reflected && seg.out) det += `<br><button class="btn primary sm" type="button" data-act="insert" data-name="${esc(e.resolvedName)}">${esc(t('eInsert', e.resolvedName))}</button>`;
      }
    } else if (e.linkStage === 'MISS') {
      s = `<span class="s c-warn"><span class="d b-warn"></span>${t('eMiss')}</span>`;
      if (sel) det = esc(t('eMissD', pct));
    } else {
      s = `<span class="s c-info"><span class="d b-info"></span>${t('eAmb')}</span>`;
      if (sel) det = esc(t('eAmbD'));
    }
    const name = isConfirmed(e) ? `<span class="k">${esc(e.resolvedName)}</span>` : '';
    return `<div class="ent${sel ? ' sel' : ''}" data-ent="${esc(e.surface)}"><span><span class="h hanmun">${esc(e.surface)}</span>${name}</span>${s}${det ? `<div class="det">${det}</div>` : ''}</div>`;
  }

  function renderProgress() {
    renderFilters();
    const n = state.segments.length;
    if (!n) { $('#sb-progress').textContent = t('noSegs'); $('#sb-meter').style.width = '0'; $('#sb-model').textContent = ''; return; }
    const done = state.segments.filter((s) => s.out).length;
    const rev = state.segments.filter((s) => s.reviewed).length;
    $('#sb-progress').textContent = t('progress', n, done, rev);
    $('#sb-meter').style.width = `${Math.round(rev / n * 100)}%`;
    const last = [...state.segments].reverse().find((s) => s.meta && s.meta.model);
    $('#sb-model').textContent = last ? `${last.meta.model}${last.meta.kbVersion ? ' · ' + last.meta.kbVersion : ''}` : '';
  }

  function renderToolbar() {
    const has = state.segments.length > 0;
    $('#btn-run').hidden = !!running;
    $('#btn-stop').hidden = !running;
    $('#btn-run').disabled = !has;
    $('#btn-copy').disabled = $('#btn-export').disabled = $('#btn-clear').disabled = !has || !!running;
    $('#btn-import').disabled = !!running;
    const r = $('#seg-panel [data-act="run"]');
    if (r) r.disabled = !!running || current()?.status === 'loading';
  }

  function renderKeys() {
    const k = (on, label) => `<span class="k"><span class="d" style="background:${on ? 'var(--ok)' : 'var(--t3)'}"></span>${label}</span>`;
    $('#sb-keys').innerHTML = k(keys.api, t('kApi')) + k(keys.llm, t('kLlm'));
  }

  // 언어·테마를 바꾸면 정적 문구를 갈아 끼우고 동적 영역을 다시 그린다
  function applyChrome() {
    document.documentElement.lang = prefs.lang;
    document.documentElement.dataset.theme = prefs.theme;
    document.title = t('docTitle');
    document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.lang === prefs.lang)));
    $('#theme-icon').setAttribute('href', prefs.theme === 'dark' ? '#i-sun' : '#i-moon');
    document.body.classList.toggle('hide-reading', !prefs.reading);
    $('#opt-reading').checked = prefs.reading;
  }

  function renderAll() { applyChrome(); renderSegments(); renderSide(); renderProgress(); renderToolbar(); renderKeys(); }

  // ── 보조 ──
  function current() { return state.segments.find((s) => s.id === state.selected) || null; }
  function num(seg) { return state.segments.indexOf(seg) + 1; }
  function select(id, focus = true) {
    if (state.selected === id) return;
    const prev = current();
    state.selected = id; state.selEnt = null;
    if (prev) document.querySelector(`.seg[data-id="${prev.id}"]`)?.classList.remove('active');
    const el = document.querySelector(`.seg[data-id="${id}"]`);
    if (el) {
      el.classList.add('active');
      if (prev) refreshSegChrome(prev);
      el.scrollIntoView({ block: 'nearest' });
      if (focus) el.querySelector('textarea')?.focus();
    }
    renderSide(); save();
  }
  function autosize(ta) { ta.style.height = 'auto'; ta.style.height = Math.max(60, ta.scrollHeight) + 'px'; }
  function reignLabel(y) {
    y = Number(y);
    if (y >= 1623 && y <= 1649) return t('reign', 'injo', y - 1622);
    if (y >= 1777 && y <= 1800) return t('reign', 'jeongjo', y - 1776);
    return '';
  }
  let msgTimer = null;
  function message(text) {
    const el = $('#sb-msg');
    el.textContent = text; el.classList.add('flash');
    clearTimeout(msgTimer); msgTimer = setTimeout(() => el.classList.remove('flash'), 1600);
  }
  async function copyText(text, done) {
    try { await navigator.clipboard.writeText(text); message(done); }
    catch (_) { message(t('msgCopyFail')); }
  }

  // ── 대화상자 ──
  function openImport(sample) {
    const d = $('#dlg-import');
    $('#import-text').value = sample ? SAMPLE.text : '';
    $('#import-year').value = sample ? SAMPLE.year : (current()?.year || '');
    $('#import-append').checked = false;
    $('#import-append-row').hidden = !state.segments.length;
    updateYearHint();
    d.returnValue = '';
    d.showModal();
    $('#import-text').focus();
  }
  function updateYearHint() { $('#import-year-hint').textContent = reignLabel($('#import-year').value); }
  $('#import-year').addEventListener('input', updateYearHint);
  $('#btn-sample').addEventListener('click', () => { $('#import-text').value = SAMPLE.text; $('#import-year').value = SAMPLE.year; updateYearHint(); });
  $('#dlg-import').addEventListener('close', () => {
    if ($('#dlg-import').returnValue !== 'ok') return;
    const parts = splitSource($('#import-text').value);
    if (!parts.length) { message(t('msgNoSource')); return; }
    const year = $('#import-year').value || null;
    const segs = parts.map((p) => newSegment(p, year));
    if ($('#import-append').checked) state.segments.push(...segs);
    else state.segments = segs;
    state.selected = segs[0].id; state.selEnt = null; state.filter = 'all';
    renderAll(); save();
    message(t('msgImported', segs.length));
  });

  function openSettings() {
    $('#set-api').value = keys.api; $('#set-llm').value = keys.llm; $('#set-remember').checked = keys.remember;
    $('#dlg-settings').returnValue = '';
    $('#dlg-settings').showModal();
  }
  $('#btn-settings').addEventListener('click', openSettings);
  $('#btn-forget').addEventListener('click', () => {
    keys = { api: '', llm: '', remember: false }; saveKeys(); renderKeys();
    $('#dlg-settings').close('cancel'); message(t('msgKeysCleared'));
  });
  $('#dlg-settings').addEventListener('close', () => {
    if ($('#dlg-settings').returnValue !== 'ok') return;
    keys = { api: $('#set-api').value.trim(), llm: $('#set-llm').value.trim(), remember: $('#set-remember').checked };
    saveKeys(); renderKeys();
  });

  // ── 내보내기 ──
  function download(name, text, type) {
    const blob = new Blob(['﻿' + text], { type });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  $('#btn-export').addEventListener('click', () => { $('#dlg-export').returnValue = ''; $('#dlg-export').showModal(); });
  $('#dlg-export').addEventListener('close', () => {
    if ($('#dlg-export').returnValue !== 'ok') return;
    const fmt = document.querySelector('input[name=fmt]:checked').value;
    const rows = state.segments.filter((s) => !$('#exp-reviewed').checked || s.reviewed);
    if (!rows.length) { message(t('msgNoExport')); return; }
    const stamp = new Date().toISOString().slice(0, 10);
    const names = t('file');
    const cell = (s) => String(s ?? '').replace(/[\t\r\n]+/g, ' ');
    if (fmt === 'txt') download(`${names.txt}_${stamp}.txt`, rows.map((s) => s.out).join('\n\n'), 'text/plain;charset=utf-8');
    else if (fmt === 'pair') download(`${names.pair}_${stamp}.txt`, rows.map((s) => `[${num(s)}]\n${s.src}\n${s.out}`).join('\n\n'), 'text/plain;charset=utf-8');
    else {
      const grade = t('tsvGrade');
      const body = rows.map((s) => {
        const c = check(s);
        return [num(s), s.year || '', cell(s.src), cell(s.out), cell(s.mt), s.mt && s.out !== s.mt ? 'Y' : '', s.reviewed ? 'Y' : '',
          grade[c.grade] || '',
          c.confirmed.map((e) => `${e.surface}=${e.resolvedName}`).join('; '),
          [...c.miss, ...c.amb].map((e) => e.surface).join('; ')].join('\t');
      });
      download(`${names.tsv}_${stamp}.tsv`, [t('tsvHead').join('\t'), ...body].join('\n'), 'text/tab-separated-values;charset=utf-8');
    }
    message(t('msgExported', rows.length));
  });
  $('#btn-copy').addEventListener('click', () => {
    const text = state.segments.map((s) => s.out).filter(Boolean).join('\n\n');
    if (!text) { message(t('msgNoCopy')); return; }
    copyText(text, t('msgCopiedAll'));
  });
  $('#btn-clear').addEventListener('click', () => {
    if (!confirm(t('confirmClear'))) return;
    state = { segments: [], selected: null, selEnt: null, filter: 'all' };
    renderAll(); save();
  });

  // ── 이벤트 ──
  $('#btn-import').addEventListener('click', () => openImport(false));
  $('#btn-run').addEventListener('click', runAll);
  $('#btn-stop').addEventListener('click', () => { running?.abort.abort(); });
  document.querySelectorAll('[data-lang]').forEach((b) => b.addEventListener('click', () => {
    prefs.lang = b.dataset.lang; savePrefs(); renderAll();
  }));
  $('#btn-theme').addEventListener('click', () => {
    prefs.theme = prefs.theme === 'dark' ? 'light' : 'dark'; savePrefs(); applyChrome();
  });

  $('#segments').addEventListener('click', (ev) => {
    const act = ev.target.closest('[data-act]')?.dataset.act;
    if (act === 'import') return openImport(false);
    if (act === 'sample') return openImport(true);
    const segEl = ev.target.closest('.seg');
    if (!segEl) return;
    const seg = state.segments.find((s) => s.id === segEl.dataset.id);
    const mark = ev.target.closest('mark.ent');
    if (state.selected !== seg.id) select(seg.id, !mark && !ev.target.closest('input,label'));
    if (mark) { state.selEnt = mark.dataset.ent; refreshSegChrome(seg); renderSide(); }
  });
  $('#segments').addEventListener('focusin', (ev) => {
    const segEl = ev.target.closest('.seg');
    if (segEl && state.selected !== segEl.dataset.id) select(segEl.dataset.id, false);
  });
  $('#segments').addEventListener('input', (ev) => {
    if (ev.target.dataset.role !== 'out') return;
    const seg = state.segments.find((s) => s.id === ev.target.closest('.seg').dataset.id);
    seg.out = ev.target.value; autosize(ev.target);
    refreshSegChrome(seg); renderSide(); renderProgress(); save();
  });
  function setReviewed(seg, on) {
    seg.reviewed = on;
    refreshSegChrome(seg); renderProgress(); save();
  }
  $('#segments').addEventListener('change', (ev) => {
    if (ev.target.dataset.role !== 'reviewed') return;
    setReviewed(state.segments.find((s) => s.id === ev.target.closest('.seg').dataset.id), ev.target.checked);
  });

  $('#seg-panel').addEventListener('input', (ev) => {
    if (ev.target.dataset.role !== 'seg-year') return;
    const seg = current(); if (!seg) return;
    seg.year = ev.target.value || null;
    $('#seg-reign').textContent = reignLabel(seg.year);
    save();
  });
  $('#seg-panel').addEventListener('click', (ev) => {
    const act = ev.target.closest('[data-act]')?.dataset.act;
    const seg = current(); if (!seg || !act) return;
    if (act === 'run' && !running && seg.status !== 'loading') runOne(seg);
    if (act === 'copy') copyText(seg.out, t('msgCopied', num(seg)));
    if (act === 'revert') {
      if (!confirm(t('confirmRevert'))) return;
      seg.out = seg.mt; renderSeg(seg); renderSide(); renderProgress(); save();
    }
  });

  $('#ent-panel').addEventListener('mousedown', (ev) => {
    // 「넣기」를 눌러도 textarea 커서를 잃지 않게 포커스 이동을 막는다.
    if (ev.target.closest('[data-act="insert"]')) ev.preventDefault();
  });
  $('#ent-panel').addEventListener('click', (ev) => {
    const seg = current(); if (!seg) return;
    const ins = ev.target.closest('[data-act="insert"]');
    if (ins) {
      const ta = document.querySelector(`.seg[data-id="${seg.id}"] textarea`);
      const name = ins.dataset.name;
      const pos = document.activeElement === ta ? ta.selectionStart : ta.value.length;
      ta.setRangeText(name, pos, document.activeElement === ta ? ta.selectionEnd : pos, 'end');
      ta.focus();
      ta.dispatchEvent(new Event('input', { bubbles: true }));
      return;
    }
    const row = ev.target.closest('.ent');
    if (row) { state.selEnt = state.selEnt === row.dataset.ent ? null : row.dataset.ent; refreshSegChrome(seg); renderSide(); }
  });

  // 지금 보이는(걸러지지 않은) 문단 사이에서만 움직인다
  function neighbor(seg, dir) {
    const visible = state.segments.filter((s) => !document.querySelector(`.seg[data-id="${s.id}"]`)?.hidden);
    if (!visible.length) return null;
    const i = seg ? visible.indexOf(seg) : -1;
    if (i < 0) return visible[dir > 0 ? 0 : visible.length - 1];
    return visible[i + dir] || null;
  }

  document.addEventListener('keydown', (ev) => {
    if (document.querySelector('dialog[open]')) return;
    const seg = current();
    // CAT 도구 관례: Ctrl+Enter = 이 문단 확정(검토 완료) 후 다음으로
    if ((ev.ctrlKey || ev.metaKey) && ev.key === 'Enter' && seg) {
      ev.preventDefault();
      if (!seg.out) { message(t('msgEmptyNoReview')); return; }
      setReviewed(seg, true);
      const next = neighbor(seg, 1);
      if (next) select(next.id, true); else message(t('msgLast'));
      return;
    }
    if (ev.altKey && ev.key === 'Enter' && seg && !running && seg.status !== 'loading') {
      ev.preventDefault(); runOne(seg); return;
    }
    if (ev.altKey && (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') && state.segments.length) {
      ev.preventDefault();
      const next = neighbor(seg, ev.key === 'ArrowDown' ? 1 : -1);
      if (next) select(next.id, true);
    }
  });
  window.addEventListener('resize', () => document.querySelectorAll('.seg textarea').forEach(autosize));

  $('#filters').addEventListener('click', (ev) => {
    const b = ev.target.closest('[data-filter]');
    if (!b || b.disabled) return;
    state.filter = b.dataset.filter;
    renderFilters(); applyFilter();
  });
  $('#opt-reading').addEventListener('change', (ev) => { prefs.reading = ev.target.checked; savePrefs(); applyChrome(); });

  // ── 파일 불러오기 — 한국어 윈도우의 .txt는 EUC-KR(CP949)인 경우가 많아 UTF-8이 깨지면 그쪽으로 읽는다 ──
  async function readTextFile(file) {
    const buf = await file.arrayBuffer();
    try { return new TextDecoder('utf-8', { fatal: true }).decode(buf).replace(/^﻿/, ''); }
    catch (_) { return new TextDecoder('euc-kr').decode(buf); }
  }
  async function importFile(file) {
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { message(t('msgTooBig')); return; }
    const text = await readTextFile(file);
    if (!$('#dlg-import').open) openImport(false);
    const ta = $('#import-text');
    ta.value = ta.value ? ta.value.replace(/\s*$/, '\n') + text : text;
    message(t('msgFileRead', file.name));
  }
  $('#import-file').addEventListener('change', (ev) => { importFile(ev.target.files[0]); ev.target.value = ''; });

  let dragDepth = 0, dropzone = null;
  const hasFiles = (ev) => [...(ev.dataTransfer?.types || [])].includes('Files');
  window.addEventListener('dragenter', (ev) => {
    if (!hasFiles(ev) || running) return;
    if (dragDepth++ === 0) {
      dropzone = document.createElement('div');
      dropzone.className = 'drop';
      dropzone.textContent = t('drop');
      document.body.appendChild(dropzone);
    }
  });
  window.addEventListener('dragleave', () => { if (dragDepth && --dragDepth === 0) dropzone?.remove(); });
  window.addEventListener('dragover', (ev) => { if (hasFiles(ev)) ev.preventDefault(); });
  window.addEventListener('drop', (ev) => {
    if (!hasFiles(ev)) return;
    ev.preventDefault(); dragDepth = 0; dropzone?.remove();
    if (!running) importFile(ev.dataTransfer.files[0]);
  });

  load();
  if (state.segments.length && !current()) state.selected = state.segments[0].id;
  renderAll();
})();
</script>
</body>
</html>
