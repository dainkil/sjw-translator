<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>승정원일기 번역 작업대</title>
<!--
  번역가용 작업 화면. 빌드 도구 없이 Spring static으로 서빙한다 (§7 "프론트엔드 완성도" 배제 —
  프레임워크를 들이지 않고 파일 하나로 끝낸다). API는 같은 오리진의 /api/v1/translations/sync만 쓴다.

  키 취급 (ADR-020): Gemini 키(X-Llm-Key)는 기본적으로 메모리에만 둔다. "이 탭에서 기억"을 켤 때만
  sessionStorage에 두고, localStorage에는 어떤 키도 쓰지 않는다. 작업 내용(원문·번역·검토 표시)만
  localStorage에 저장한다.
-->
<style>
:root {
  --bg: #f6f4ef;
  --panel: #ffffff;
  --panel-2: #faf8f3;
  --ink: #1f1d1a;
  --muted: #6b665d;
  --line: #e2ddd2;
  --line-strong: #cfc8b9;
  --accent: #9e3324;
  --accent-ink: #ffffff;
  --accent-soft: #f6e3df;
  --ok: #2f7a4a;
  --ok-soft: #e1f0e6;
  --warn: #9a6a00;
  --warn-soft: #f8edcf;
  --bad: #b3261e;
  --bad-soft: #f9dedc;
  --info: #2c5d8f;
  --info-soft: #dfeaf5;
  --focus: #9e3324;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #161513;
    --panel: #1f1e1b;
    --panel-2: #24221f;
    --ink: #ece8df;
    --muted: #a39d92;
    --line: #34312c;
    --line-strong: #47433c;
    --accent: #e0806f;
    --accent-ink: #1a1210;
    --accent-soft: #3b231e;
    --ok: #7cc795;
    --ok-soft: #1d3326;
    --warn: #e2b54f;
    --warn-soft: #382d13;
    --bad: #f08a80;
    --bad-soft: #3d1f1c;
    --info: #8fb8e3;
    --info-soft: #1c2a3a;
    --focus: #e0806f;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #161513; --panel: #1f1e1b; --panel-2: #24221f; --ink: #ece8df; --muted: #a39d92;
  --line: #34312c; --line-strong: #47433c; --accent: #e0806f; --accent-ink: #1a1210; --accent-soft: #3b231e;
  --ok: #7cc795; --ok-soft: #1d3326; --warn: #e2b54f; --warn-soft: #382d13; --bad: #f08a80; --bad-soft: #3d1f1c;
  --info: #8fb8e3; --info-soft: #1c2a3a; --focus: #e0806f; --shadow: none;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.55 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
.hanmun { font-family: "Noto Serif CJK KR", "Noto Serif KR", "Source Han Serif K", "Batang", "바탕", "Songti SC", serif; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* ── 상단 바 ── */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.brand h1 { font-size: 16px; margin: 0; white-space: nowrap; }
.brand .seal {
  display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 4px;
  background: var(--accent); color: var(--accent-ink); font-size: 13px; font-weight: 700;
  align-self: center;
}
.brand small { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spacer { flex: 1; }
.keystate { display: flex; gap: 6px; flex-wrap: wrap; }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 32px; padding: 0 12px;
  border: 1px solid var(--line-strong); border-radius: 6px;
  background: var(--panel); cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--panel-2); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.05); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--panel-2); }
.btn.sm { height: 26px; padding: 0 8px; font-size: 12px; }
a.btn { text-decoration: none; color: var(--ink); }

.chip {
  display: inline-flex; align-items: center; gap: 4px;
  height: 22px; padding: 0 8px; border-radius: 11px;
  font-size: 12px; white-space: nowrap;
  background: var(--panel-2); color: var(--muted); border: 1px solid var(--line);
}
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.info { background: var(--info-soft); color: var(--info); border-color: transparent; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

/* ── 작업 영역 ── */
.layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  gap: 16px;
  padding: 16px;
  max-width: 1480px;
  margin: 0 auto;
}
.toolbar {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin-bottom: 12px;
}
.progress {
  display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 13px;
}
.bar { width: 140px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ok); width: 0; transition: width .2s; }

.colhead {
  display: grid; grid-template-columns: 36px minmax(0,1fr) minmax(0,1fr); gap: 0;
  font-size: 12px; color: var(--muted); padding: 0 0 6px;
}
.colhead span { padding: 0 14px; }

.seg {
  display: grid;
  grid-template-columns: 36px minmax(0,1fr) minmax(0,1fr);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  margin-bottom: 8px;
  box-shadow: var(--shadow);
}
.seg.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.seg .num {
  padding: 12px 0; text-align: center; color: var(--muted); font-size: 12px;
  border-right: 1px solid var(--line); font-variant-numeric: tabular-nums;
}
.seg .src {
  padding: 12px 14px; border-right: 1px solid var(--line);
  font-size: 17px; line-height: 1.9; word-break: break-all;
}
.seg .tgt { display: flex; flex-direction: column; min-width: 0; }
.seg textarea {
  flex: 1; width: 100%; min-height: 72px; resize: none;
  border: 0; background: transparent; padding: 12px 14px;
  font-size: 15px; line-height: 1.75;
}
.seg textarea:focus { outline: none; background: var(--panel-2); }
.seg textarea::placeholder { color: var(--muted); }
.seg .foot {
  grid-column: 2 / 4;
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding: 6px 10px; border-top: 1px solid var(--line);
  background: var(--panel-2); border-radius: 0 0 8px 0;
  font-size: 12px; color: var(--muted);
}
.seg .foot .year { display: inline-flex; align-items: center; gap: 4px; }
.seg .foot input[type=number] {
  width: 64px; height: 24px; padding: 0 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel);
}
.seg .foot label.chk { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
.seg .err { color: var(--bad); }
.seg.loading .tgt textarea { opacity: .5; }

mark.ent {
  background: transparent; color: inherit; cursor: pointer;
  border-bottom: 2px solid var(--line-strong); padding: 0 1px;
}
mark.ent.ok { border-color: var(--ok); }
mark.ent.miss { border-color: var(--warn); border-bottom-style: dashed; }
mark.ent.amb { border-color: var(--info); border-bottom-style: dotted; }
mark.ent.loc { border-color: var(--line-strong); }
mark.ent.lost { border-color: var(--bad); background: var(--bad-soft); }
mark.ent.sel { background: var(--accent-soft); }

/* ── 사이드 패널 ── */
.side { position: sticky; top: 68px; align-self: start; display: flex; flex-direction: column; gap: 12px; max-height: calc(100vh - 84px); overflow: auto; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); }
.card > h2 { font-size: 13px; margin: 0; padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 6px; }
.card > h2 .count { color: var(--muted); font-weight: 400; }
.card .body { padding: 10px 12px; }
.empty-note { color: var(--muted); font-size: 13px; }

.ent-card { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; }
.ent-card:last-child { margin-bottom: 0; }
.ent-card.sel { border-color: var(--accent); }
.ent-card .row1 { display: flex; align-items: baseline; gap: 8px; }
.ent-card .surface { font-size: 18px; }
.ent-card .arrow { color: var(--muted); }
.ent-card .name { font-size: 15px; font-weight: 600; }
.ent-card .row2 { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.ent-card .why { margin-top: 6px; font-size: 12px; color: var(--muted); }
.ent-card .acts { margin-top: 6px; display: flex; gap: 6px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; word-break: break-all; }
.legend { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.legend span mark { margin-right: 6px; }
.kbd { font-family: ui-monospace, Consolas, monospace; font-size: 11px; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--panel-2); }

/* ── 빈 상태 ── */
.empty {
  background: var(--panel); border: 1px dashed var(--line-strong); border-radius: 10px;
  padding: 40px 24px; text-align: center;
}
.empty h2 { margin: 0 0 6px; font-size: 18px; }
.empty p { margin: 0 auto 16px; color: var(--muted); max-width: 520px; }
.empty .acts { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

/* ── 대화상자 ── */
dialog {
  border: 1px solid var(--line); border-radius: 10px; padding: 0;
  background: var(--panel); color: var(--ink);
  width: min(640px, calc(100vw - 32px));
  box-shadow: 0 10px 40px rgba(0,0,0,.25);
}
dialog::backdrop { background: rgba(0,0,0,.35); }
dialog header { padding: 14px 16px; border-bottom: 1px solid var(--line); font-weight: 600; }
dialog .content { padding: 14px 16px; display: grid; gap: 12px; }
dialog footer { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.field { display: grid; gap: 4px; }
.field > span { font-size: 13px; font-weight: 600; }
.field > small { color: var(--muted); font-size: 12px; }
.field input[type=text], .field input[type=password], .field input[type=number], .field textarea {
  width: 100%; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--panel); padding: 8px 10px;
}
.field textarea { min-height: 220px; resize: vertical; font-size: 16px; line-height: 1.8; }
.inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ── 알림 ── */
.toast {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px;
  font-size: 13px; max-width: calc(100vw - 32px); z-index: 50;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.toast.show { opacity: 1; }

@media (max-width: 1080px) {
  .layout { grid-template-columns: minmax(0,1fr); }
  .side { position: static; max-height: none; }
}
@media (max-width: 720px) {
  .topbar { flex-wrap: wrap; }
  .brand small { display: none; }
  .layout { padding: 12px 16px; }
  .colhead { display: none; }
  .seg { grid-template-columns: minmax(0,1fr); }
  .seg .num { display: none; }
  .seg .src { border-right: 0; border-bottom: 1px solid var(--line); }
  .seg .foot { grid-column: 1; border-radius: 0 0 8px 8px; }
  .bar { width: 80px; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="seal hanmun" aria-hidden="true">譯</span>
    <h1>승정원일기 번역 작업대</h1>
    <small>인물 KB로 인명을 확정해 번역합니다</small>
  </div>
  <div class="spacer"></div>
  <div class="keystate" id="keystate"></div>
  <button class="btn" id="btn-settings" type="button">키 설정</button>
  <a class="btn ghost" href="/swagger-ui.html" target="_blank" rel="noopener">API 문서</a>
</header>

<main class="layout">
  <section aria-label="번역 문단">
    <div class="toolbar" id="toolbar">
      <button class="btn" id="btn-import" type="button">원문 불러오기</button>
      <button class="btn primary" id="btn-run" type="button">전체 번역</button>
      <button class="btn" id="btn-stop" type="button" hidden>멈춤</button>
      <div class="progress" id="progress"></div>
      <div class="spacer"></div>
      <button class="btn" id="btn-copy" type="button">번역문 복사</button>
      <button class="btn" id="btn-export" type="button">내보내기</button>
      <button class="btn ghost" id="btn-clear" type="button">새 작업</button>
    </div>
    <div class="colhead" id="colhead"><span></span><span>원문</span><span>번역 (직접 고칠 수 있습니다)</span></div>
    <div id="segments"></div>
  </section>

  <aside class="side" aria-label="검토 패널">
    <div class="card">
      <h2>인명 <span class="count" id="ent-count"></span></h2>
      <div class="body" id="ent-panel"></div>
    </div>
    <div class="card">
      <h2>검토 메모 <span class="count" id="note-count"></span></h2>
      <div class="body" id="note-panel"></div>
    </div>
    <div class="card">
      <h2>번역 정보</h2>
      <div class="body" id="meta-panel"></div>
    </div>
    <div class="card">
      <h2>표시 안내</h2>
      <div class="body legend">
        <span><mark class="ent ok hanmun">鄭太和</mark>KB로 확정된 인물</span>
        <span><mark class="ent amb hanmun">金某</mark>후보가 여러 명 — 문맥으로 판단</span>
        <span><mark class="ent miss hanmun">李某</mark>KB에 없는 인물 — 음을 직접 확인</span>
        <span><mark class="ent lost hanmun">鄭太和</mark>확정했는데 번역문에 이름이 없음</span>
        <span style="margin-top:4px"><span class="kbd">Ctrl</span> + <span class="kbd">Enter</span> 지금 문단 번역 · <span class="kbd">Alt</span> + <span class="kbd">↑↓</span> 문단 이동</span>
      </div>
    </div>
  </aside>
</main>

<dialog id="dlg-import">
  <form method="dialog">
    <header>원문 불러오기</header>
    <div class="content">
      <label class="field">
        <span>한문 원문</span>
        <textarea id="import-text" class="hanmun" placeholder="○ 吏曹參議鄭太和上疏。疏辭缺, 批答缺"></textarea>
        <small>줄바꿈과 ○ 표시를 기준으로 문단을 나눕니다. 2,000자가 넘는 문단은 마침표(。)에서 끊습니다.</small>
      </label>
      <label class="field">
        <span>문서 연도 (서기)</span>
        <div class="inline">
          <input type="number" id="import-year" min="1392" max="1910" style="width:120px">
          <small id="import-year-hint"></small>
        </div>
        <small>동명이인을 활동 시기로 가립니다. 모르면 비워 두세요. 문단마다 따로 바꿀 수 있습니다.</small>
      </label>
      <label class="inline" style="font-size:13px">
        <input type="checkbox" id="import-append"> 지금 작업 뒤에 이어 붙이기
      </label>
    </div>
    <footer>
      <button class="btn ghost" type="button" id="btn-sample">예시 원문</button>
      <div class="spacer"></div>
      <button class="btn" value="cancel" formnovalidate>취소</button>
      <button class="btn primary" value="ok" id="btn-import-ok">불러오기</button>
    </footer>
  </form>
</dialog>

<dialog id="dlg-settings">
  <form method="dialog">
    <header>키 설정</header>
    <div class="content">
      <label class="field">
        <span>API 키 (X-Api-Key)</span>
        <input type="password" id="set-api" autocomplete="off" spellcheck="false">
        <small>발급받은 작업 키입니다. 로컬 서버라면 비워 둬도 됩니다.</small>
      </label>
      <label class="field">
        <span>본인 Gemini 키 (X-Llm-Key)</span>
        <input type="password" id="set-llm" autocomplete="off" spellcheck="false">
        <small>미리 번역해 둔 문장은 이 키 없이도 나옵니다. 처음 보는 문장은 이 키로 번역하며, 서버는 키를 저장하거나 기록하지 않습니다.</small>
      </label>
      <label class="inline" style="font-size:13px">
        <input type="checkbox" id="set-remember"> 이 탭을 닫을 때까지 기억 (기본은 새로고침하면 지워짐)
      </label>
    </div>
    <footer>
      <button class="btn ghost" type="button" id="btn-forget">키 지우기</button>
      <div class="spacer"></div>
      <button class="btn" value="cancel" formnovalidate>취소</button>
      <button class="btn primary" value="ok">저장</button>
    </footer>
  </form>
</dialog>

<dialog id="dlg-export">
  <form method="dialog">
    <header>내보내기</header>
    <div class="content">
      <label class="inline"><input type="radio" name="fmt" value="txt" checked> 번역문만 (.txt)</label>
      <label class="inline"><input type="radio" name="fmt" value="pair"> 원문·번역 대조 (.txt)</label>
      <label class="inline"><input type="radio" name="fmt" value="tsv"> 표 (.tsv — 엑셀에서 열림, 인명·검토 상태 포함)</label>
      <label class="inline" style="font-size:13px"><input type="checkbox" id="exp-reviewed"> 검토 완료한 문단만</label>
    </div>
    <footer>
      <button class="btn" value="cancel" formnovalidate>취소</button>
      <button class="btn primary" value="ok">파일로 저장</button>
    </footer>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  const API = '/api/v1/translations/sync';
  const STORE = 'sjw-workbench-v1';
  const KEYSTORE = 'sjw-workbench-keys';
  const MAX_CHARS = 2000; // TranslateRequest @Size(max = 2000)

  const SAMPLE = {
    year: 1638,
    text: '○ 吏曹參議鄭太和上疏。疏辭缺, 批答缺\n○ 以金瑬爲承旨',
  };

  const STAGE = {
    SINGLE:    { label: '역색인 단일 후보', cls: 'ok' },
    TIME:      { label: '활동 시기로 확정', cls: 'ok' },
    OFFICE:    { label: '관직으로 확정', cls: 'ok' },
    AMBIGUOUS: { label: '후보 여러 명', cls: 'info' },
    MISS:      { label: 'KB 미등재', cls: 'warn' },
  };

  const ERRORS = {
    API_KEY_REQUIRED: 'API 키가 필요한 서버입니다. 키 설정에서 입력하세요.',
    UNKNOWN_API_KEY: '등록되지 않은 API 키입니다.',
    BYOK_REQUIRED: '미리 번역된 적 없는 문장입니다. 본인 Gemini 키를 넣으면 번역합니다.',
    TENANT_DAILY_LIMIT: '오늘 쓸 수 있는 번역 횟수를 다 썼습니다.',
    LLM_RATE_LIMITED: 'Gemini 분당 한도에 걸렸습니다.',
    LLM_QUOTA_DAILY: 'Gemini 일일 한도를 다 썼습니다.',
    LLM_SPEND_CAP: 'Gemini 지출 상한에 걸렸습니다.',
    LLM_KEY_REJECTED: 'Gemini가 키를 거부했습니다. 키를 확인하세요.',
    LLM_UPSTREAM_AUTH: '서버의 Gemini 인증에 문제가 있습니다.',
    LLM_CONTENT_FILTERED: 'Gemini 콘텐츠 필터에 걸렸습니다.',
    NER_UNAVAILABLE: '인명 인식 서버가 응답하지 않습니다.',
    LLM_TIMEOUT: 'Gemini 응답이 너무 늦어 끊었습니다.',
    LLM_UPSTREAM_ERROR: 'Gemini 쪽 오류입니다.',
    LLM_MODEL_UNAVAILABLE: '지금 이 모델을 쓸 수 없습니다.',
    LLM_PARSE_ERROR: 'Gemini 응답을 해석하지 못했습니다.',
  };
  // 다시 눌러도 같은 결과일 오류 — 전체 번역을 멈춘다.
  const HALTING = new Set(['API_KEY_REQUIRED', 'UNKNOWN_API_KEY', 'BYOK_REQUIRED', 'TENANT_DAILY_LIMIT',
    'LLM_QUOTA_DAILY', 'LLM_SPEND_CAP', 'LLM_KEY_REJECTED', 'LLM_RATE_LIMITED']);

  // ── 상태 ──
  let state = { segments: [], selected: null, selEnt: null };
  let keys = { api: '', llm: '', remember: false };
  let running = null; // { abort: AbortController }

  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Math.random().toString(36).slice(2, 10);

  function load() {
    try {
      const raw = localStorage.getItem(STORE);
      if (raw) {
        const s = JSON.parse(raw);
        state.segments = (s.segments || []).map((g) => ({ ...g, status: g.status === 'loading' ? 'idle' : g.status }));
        state.selected = s.selected || null;
      }
    } catch (_) { /* 저장소 없음 — 빈 작업으로 시작 */ }
    try {
      const raw = sessionStorage.getItem(KEYSTORE);
      if (raw) keys = { ...JSON.parse(raw), remember: true };
    } catch (_) { /* 무시 */ }
  }
  let saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try {
        localStorage.setItem(STORE, JSON.stringify({ segments: state.segments, selected: state.selected }));
      } catch (_) { /* 저장 실패해도 작업은 계속 */ }
    }, 300);
  }
  function saveKeys() {
    try {
      if (keys.remember) sessionStorage.setItem(KEYSTORE, JSON.stringify({ api: keys.api, llm: keys.llm }));
      else sessionStorage.removeItem(KEYSTORE);
    } catch (_) { /* 무시 */ }
  }

  // ── 원문 분할 ──
  function splitSource(raw) {
    const out = [];
    for (const line of raw.replace(/\r/g, '').split('\n')) {
      for (const part of line.split(/(?=○)/)) {
        const t = part.trim();
        if (!t || t === '○') continue;
        if (t.length <= MAX_CHARS) { out.push(t); continue; }
        let buf = '';
        for (const s of t.split(/(?<=。)/)) {
          if ((buf + s).length > MAX_CHARS && buf) { out.push(buf); buf = ''; }
          buf += s;
          while (buf.length > MAX_CHARS) { out.push(buf.slice(0, MAX_CHARS)); buf = buf.slice(MAX_CHARS); }
        }
        if (buf) out.push(buf);
      }
    }
    return out;
  }

  function newSegment(src, year) {
    return { id: uid(), src, year: year || null, out: '', mt: '', status: 'idle', error: null,
      entities: [], notes: [], meta: null, reviewed: false };
  }

  // ── 인명 점검 (서버 QualityGate.nameReflected와 같은 규칙) ──
  function nameReflected(text, name) {
    if (!text || !name) return false;
    if (text.includes(name)) return true;
    const given = name.length >= 3 ? name.slice(1) : null;
    return !!given && given.length >= 2 && text.includes(given);
  }
  function uniqueEntities(seg) {
    const seen = new Map();
    for (const e of seg.entities || []) if (!seen.has(e.surface)) seen.set(e.surface, e);
    return [...seen.values()];
  }
  function isConfirmed(e) { return !!(e.kbId && e.resolvedName); }
  function check(seg) {
    const ents = uniqueEntities(seg).filter((e) => e.type === 'PER');
    const confirmed = ents.filter(isConfirmed);
    const missing = confirmed.filter((e) => !nameReflected(seg.out, e.resolvedName));
    const miss = ents.filter((e) => e.linkStage === 'MISS');
    const amb = ents.filter((e) => e.ambiguous);
    let grade = null;
    if (seg.status === 'done' || seg.out) {
      grade = missing.length ? 'lost' : (miss.length || amb.length) ? 'review' : 'ok';
    }
    return { confirmed, missing, miss, amb, grade };
  }

  // ── API ──
  async function translate(seg, signal) {
    const headers = { 'Content-Type': 'application/json', 'Accept': 'application/json' };
    if (keys.api) headers['X-Api-Key'] = keys.api;
    if (keys.llm) headers['X-Llm-Key'] = keys.llm;
    const body = { text: seg.src };
    if (seg.year) body.year = Number(seg.year);
    let res;
    try {
      res = await fetch(API, { method: 'POST', headers, body: JSON.stringify(body), signal });
    } catch (e) {
      if (e.name === 'AbortError') throw e;
      throw { code: 'NETWORK', message: '서버에 연결하지 못했습니다.' };
    }
    let data = null;
    try { data = await res.json(); } catch (_) { /* 본문 없음 */ }
    if (!res.ok) {
      const code = data && data.error || ('HTTP_' + res.status);
      let message = ERRORS[code] || (res.status === 400 ? '요청 형식 오류입니다.' : `서버 오류 (${res.status})`);
      if (code === 'TENANT_DAILY_LIMIT' && data.dailyCallLimit) message += ` (하루 ${data.dailyCallLimit}회)`;
      if (data && data.retryAfterSeconds) message += ` ${data.retryAfterSeconds}초 뒤에 다시 시도하세요.`;
      throw { code, message };
    }
    return data;
  }

  async function runOne(seg, signal) {
    seg.status = 'loading'; seg.error = null;
    renderSeg(seg);
    try {
      const r = await translate(seg, signal);
      const edited = seg.out && seg.out !== seg.mt;
      seg.mt = r.translatedText || '';
      if (!edited) seg.out = seg.mt;
      seg.entities = r.entities || [];
      seg.notes = (r.uncertainSpans || []);
      seg.meta = r.meta || null;
      seg.status = 'done';
      if (edited) toast('직접 고친 번역은 그대로 두었습니다. 새 기계 번역은 「기계 번역으로 되돌리기」로 볼 수 있습니다.');
    } catch (e) {
      if (e && e.name === 'AbortError') { seg.status = seg.mt ? 'done' : 'idle'; }
      else { seg.status = 'error'; seg.error = e; }
    }
    renderSeg(seg);
    renderSide(); renderProgress(); save();
    return seg.status === 'error' ? seg.error : null;
  }

  async function runAll() {
    if (running) return;
    const todo = state.segments.filter((s) => s.status !== 'done');
    if (!todo.length) { toast('번역할 문단이 없습니다. 다시 번역하려면 문단의 「다시 번역」을 누르세요.'); return; }
    running = { abort: new AbortController() };
    renderToolbar();
    for (const seg of todo) {
      if (running.abort.signal.aborted) break;
      select(seg.id, false);
      const err = await runOne(seg, running.abort.signal);
      if (err && HALTING.has(err.code)) {
        toast(err.message + ' 전체 번역을 멈췄습니다.');
        if (err.code === 'BYOK_REQUIRED' || err.code === 'API_KEY_REQUIRED' || err.code === 'UNKNOWN_API_KEY' || err.code === 'LLM_KEY_REJECTED') openSettings();
        break;
      }
    }
    running = null;
    renderToolbar();
  }

  // ── 렌더링 ──
  function highlight(seg) {
    const ents = uniqueEntities(seg);
    let html = esc(seg.src);
    if (!ents.length) return html;
    const { missing } = check(seg);
    const lost = new Set(missing.map((e) => e.surface));
    const sorted = [...ents].sort((a, b) => b.surface.length - a.surface.length);
    const re = new RegExp(sorted.map((e) => esc(e.surface).replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'g');
    const bySurface = new Map(ents.map((e) => [esc(e.surface), e]));
    return html.replace(re, (m) => {
      const e = bySurface.get(m);
      let cls = 'loc';
      if (e.type === 'PER') {
        cls = lost.has(e.surface) ? 'lost' : isConfirmed(e) ? 'ok' : e.ambiguous ? 'amb' : e.linkStage === 'MISS' ? 'miss' : 'loc';
      }
      const sel = state.selected === seg.id && state.selEnt === e.surface ? ' sel' : '';
      const title = e.type === 'PER' ? (e.resolvedName ? `${e.resolvedName} (${e.kbId})` : (STAGE[e.linkStage]?.label || '')) : (e.type === 'LOC' ? '지명' : e.type);
      return `<mark class="ent ${cls}${sel}" data-ent="${esc(e.surface)}" title="${esc(title)}">${m}</mark>`;
    });
  }

  function gradeChip(seg) {
    const c = check(seg);
    if (seg.status === 'loading') return '<span class="chip info"><span class="dot"></span>번역 중</span>';
    if (seg.status === 'error') return '<span class="chip bad"><span class="dot"></span>실패</span>';
    if (!c.grade) return '<span class="chip">대기</span>';
    const unsure = c.miss.length + c.amb.length;
    if (c.grade === 'lost') return `<span class="chip bad" title="KB가 확정한 인물의 이름이 번역문에 없습니다"><span class="dot"></span>인명 누락 ${c.missing.length}명</span>`;
    if (c.grade === 'review') return `<span class="chip warn" title="KB에 없거나 후보가 여럿인 인물이 있습니다"><span class="dot"></span>인명 확인 ${unsure}명</span>`;
    return `<span class="chip ok" title="KB가 확정한 인물이 모두 번역문에 있습니다"><span class="dot"></span>${c.confirmed.length ? `인명 ${c.confirmed.length}명 반영` : '인명 없음'}</span>`;
  }

  function segHtml(seg, i) {
    const m = seg.meta;
    const edited = seg.mt && seg.out !== seg.mt;
    const yearHint = seg.year ? reignLabel(seg.year) : '';
    return `
      <div class="num">${i + 1}</div>
      <div class="src hanmun" lang="zh-Hant">${highlight(seg)}</div>
      <div class="tgt">
        <textarea rows="2" data-role="out" aria-label="${i + 1}번 문단 번역" placeholder="${seg.status === 'loading' ? '번역 중…' : '번역 전입니다. Ctrl+Enter로 번역하거나 직접 입력하세요.'}">${esc(seg.out)}</textarea>
      </div>
      <div class="foot">
        ${gradeChip(seg)}
        ${m && m.cacheHit ? `<span class="chip" title="이미 번역해 둔 결과입니다. Gemini를 부르지 않았습니다.">저장된 번역</span>` : ''}
        ${edited ? '<span class="chip info">직접 수정함</span>' : ''}
        ${seg.status === 'error' ? `<span class="err">${esc(seg.error.message)}</span>` : ''}
        <span class="spacer"></span>
        <span class="year" title="동명이인을 활동 시기로 가릴 때 씁니다">연도 <input type="number" data-role="year" value="${esc(seg.year || '')}" min="1392" max="1910"> <span>${esc(yearHint)}</span></span>
        <label class="chk"><input type="checkbox" data-role="reviewed" ${seg.reviewed ? 'checked' : ''}> 검토 완료</label>
        <button class="btn sm" type="button" data-role="run" ${seg.status === 'loading' || running ? 'disabled' : ''}>${seg.status === 'done' ? '다시 번역' : '번역'}</button>
      </div>`;
  }

  function renderSeg(seg) {
    const el = document.querySelector(`.seg[data-id="${seg.id}"]`);
    if (!el) return renderSegments();
    const i = state.segments.indexOf(seg);
    const hadFocus = document.activeElement && el.contains(document.activeElement) && document.activeElement.dataset.role === 'out';
    const caret = hadFocus ? document.activeElement.selectionStart : null;
    el.className = `seg${state.selected === seg.id ? ' active' : ''}${seg.status === 'loading' ? ' loading' : ''}`;
    el.innerHTML = segHtml(seg, i);
    const ta = el.querySelector('textarea');
    autosize(ta);
    if (hadFocus) { ta.focus(); ta.setSelectionRange(caret, caret); }
  }

  // 입력 중에는 textarea를 다시 그리지 않는다 — 원문 강조와 상태 칩만 갱신.
  function refreshSegChrome(seg) {
    const el = document.querySelector(`.seg[data-id="${seg.id}"]`);
    if (!el) return;
    el.querySelector('.src').innerHTML = highlight(seg);
    const foot = el.querySelector('.foot');
    const first = foot.firstElementChild;
    const tmp = document.createElement('div');
    tmp.innerHTML = gradeChip(seg);
    foot.replaceChild(tmp.firstElementChild, first);
    const editedChip = [...foot.querySelectorAll('.chip.info')].find((c) => c.textContent === '직접 수정함');
    const edited = seg.mt && seg.out !== seg.mt;
    if (edited && !editedChip) foot.firstElementChild.insertAdjacentHTML('afterend', '<span class="chip info">직접 수정함</span>');
    if (!edited && editedChip) editedChip.remove();
  }

  function renderSegments() {
    const box = $('#segments');
    $('#colhead').hidden = !state.segments.length;
    if (!state.segments.length) {
      box.innerHTML = `
        <div class="empty">
          <h2>번역할 원문을 불러오세요</h2>
          <p>승정원일기 한문을 붙여 넣으면 문단별로 나눠 번역합니다. 원문에 나온 인물은 인물 KB에서 찾아 이름을 확정하고, 번역문에 그 이름이 제대로 들어갔는지 문단마다 표시합니다.</p>
          <div class="acts">
            <button class="btn primary" type="button" data-act="import">원문 붙여 넣기</button>
            <button class="btn" type="button" data-act="sample">예시로 시작</button>
          </div>
        </div>`;
      return;
    }
    box.innerHTML = state.segments.map((seg) => `<div class="seg" data-id="${seg.id}"></div>`).join('');
    state.segments.forEach(renderSeg);
  }

  function renderSide() {
    const seg = current();
    const entBox = $('#ent-panel'), noteBox = $('#note-panel'), metaBox = $('#meta-panel');
    if (!seg) {
      $('#ent-count').textContent = ''; $('#note-count').textContent = '';
      entBox.innerHTML = noteBox.innerHTML = metaBox.innerHTML = '<p class="empty-note">문단을 선택하면 여기에 나옵니다.</p>';
      return;
    }
    const i = state.segments.indexOf(seg) + 1;
    const ents = uniqueEntities(seg);
    $('#ent-count').textContent = ents.length ? `${i}번 문단 · ${ents.length}` : `${i}번 문단`;
    if (seg.status !== 'done' && !ents.length) {
      entBox.innerHTML = '<p class="empty-note">번역하면 원문의 인명·지명을 찾아 보여 줍니다.</p>';
    } else if (!ents.length) {
      entBox.innerHTML = '<p class="empty-note">이 문단에서 찾은 인명·지명이 없습니다.</p>';
    } else {
      const order = (e) => e.type !== 'PER' ? 4 : !nameReflected(seg.out, e.resolvedName) && isConfirmed(e) ? 0 : e.linkStage === 'MISS' ? 1 : e.ambiguous ? 2 : 3;
      entBox.innerHTML = [...ents].sort((a, b) => order(a) - order(b)).map((e) => entCard(seg, e)).join('');
    }

    const notes = seg.notes || [];
    $('#note-count').textContent = notes.length ? String(notes.length) : '';
    noteBox.innerHTML = notes.length
      ? notes.map((n) => `<div style="margin-bottom:6px"><span class="hanmun" style="font-size:16px">${esc(n.text)}</span> <span class="chip ${n.reason === 'KB_MISS' ? 'warn' : ''}">${esc(noteReason(n.reason))}</span></div>`).join('')
      : `<p class="empty-note">${seg.status === 'done' ? '번역기가 따로 남긴 불확실한 구간이 없습니다.' : '번역하면 확인이 필요한 구간을 표시합니다.'}</p>`;

    const m = seg.meta;
    if (!m) { metaBox.innerHTML = '<p class="empty-note">아직 번역하지 않았습니다.</p>'; return; }
    const lat = m.latencyMs || {};
    const latStr = Object.entries(lat).map(([k, v]) => `${latName(k)} ${v}ms`).join(' · ');
    metaBox.innerHTML = `
      <dl class="kv">
        <dt>번역 모델</dt><dd>${esc(m.model || '—')}</dd>
        <dt>출처</dt><dd>${m.cacheHit ? (m.cacheHit === 'L2_TEMPLATE' ? '같은 틀의 저장된 번역 (인명만 교체)' : '저장된 번역') : '새로 번역'}</dd>
        ${m.tokensIn != null ? `<dt>토큰</dt><dd>입력 ${m.tokensIn} · 출력 ${m.tokensOut ?? '—'}</dd>` : ''}
        <dt>소요</dt><dd>${esc(latStr || '—')}</dd>
        <dt>인물 KB</dt><dd>${esc(m.kbVersion || '—')}</dd>
        <dt>프롬프트</dt><dd>${esc(m.promptVersion || '—')}</dd>
      </dl>
      ${seg.mt && seg.out !== seg.mt ? '<div style="margin-top:8px"><button class="btn sm" type="button" data-act="revert">기계 번역으로 되돌리기</button></div>' : ''}`;
  }

  function entCard(seg, e) {
    const sel = state.selEnt === e.surface ? ' sel' : '';
    if (e.type !== 'PER') {
      return `<div class="ent-card${sel}" data-ent="${esc(e.surface)}">
        <div class="row1"><span class="surface hanmun">${esc(e.surface)}</span><span class="chip">${e.type === 'LOC' ? '지명' : esc(e.type)}</span></div>
      </div>`;
    }
    const st = STAGE[e.linkStage] || { label: e.linkStage || '—', cls: '' };
    const confirmed = isConfirmed(e);
    const reflected = confirmed && nameReflected(seg.out, e.resolvedName);
    let status = '', why = '', acts = '';
    if (confirmed) {
      status = reflected ? '<span class="chip ok">번역문에 있음</span>' : '<span class="chip bad">번역문에 없음</span>';
      if (!reflected && seg.out) {
        why = `KB가 「${esc(e.resolvedName)}」로 확정한 인물인데 번역문에서 이 이름을 찾지 못했습니다. 다른 음으로 옮겼거나 빠졌는지 확인하세요.`;
        acts = `<div class="acts"><button class="btn sm" type="button" data-act="insert" data-name="${esc(e.resolvedName)}">커서 위치에 「${esc(e.resolvedName)}」 넣기</button></div>`;
      }
    } else if (e.linkStage === 'MISS') {
      why = 'KB에 없는 이름이라 번역기가 음을 스스로 정했습니다. 음이 맞는지 직접 확인하세요.';
    } else if (e.ambiguous) {
      why = '같은 표기의 인물이 여럿이라 후보를 모두 번역기에 넘겼습니다. 문맥에 맞는 인물인지 확인하세요.';
    }
    return `<div class="ent-card${sel}" data-ent="${esc(e.surface)}">
      <div class="row1"><span class="surface hanmun">${esc(e.surface)}</span>${confirmed ? `<span class="arrow">→</span><span class="name">${esc(e.resolvedName)}</span>` : ''}</div>
      <div class="row2"><span class="chip ${st.cls}">${esc(st.label)}</span>${status}${e.kbId ? `<span class="chip" title="인물 KB 식별자">${esc(e.kbId)}</span>` : ''}<span class="chip" title="인명 인식 신뢰도">${Math.round((e.confidence || 0) * 100)}%</span></div>
      ${why ? `<div class="why">${why}</div>` : ''}${acts}
    </div>`;
  }

  function renderProgress() {
    const n = state.segments.length;
    const box = $('#progress');
    if (!n) { box.innerHTML = ''; return; }
    const done = state.segments.filter((s) => s.status === 'done' || s.out).length;
    const rev = state.segments.filter((s) => s.reviewed).length;
    const lost = state.segments.filter((s) => check(s).grade === 'lost').length;
    box.innerHTML = `<div class="bar" aria-hidden="true"><i style="width:${Math.round(rev / n * 100)}%"></i></div>
      <span>${n}문단 · 번역 ${done} · 검토 완료 ${rev}${lost ? ` · <span style="color:var(--bad)">인명 누락 ${lost}</span>` : ''}</span>`;
  }

  function renderToolbar() {
    const has = state.segments.length > 0;
    $('#btn-run').hidden = !!running;
    $('#btn-stop').hidden = !running;
    $('#btn-run').disabled = !has;
    $('#btn-copy').disabled = $('#btn-export').disabled = $('#btn-clear').disabled = !has || !!running;
    $('#btn-import').disabled = !!running;
    document.querySelectorAll('[data-role="run"]').forEach((b) => { b.disabled = !!running || b.closest('.seg').classList.contains('loading'); });
  }

  function renderKeys() {
    $('#keystate').innerHTML =
      (keys.api ? '<span class="chip ok"><span class="dot"></span>API 키</span>' : '') +
      (keys.llm ? '<span class="chip ok"><span class="dot"></span>Gemini 키</span>' : '<span class="chip" title="미리 번역된 문장만 나옵니다">Gemini 키 없음</span>');
  }

  function renderAll() { renderSegments(); renderSide(); renderProgress(); renderToolbar(); renderKeys(); }

  // ── 보조 ──
  function current() { return state.segments.find((s) => s.id === state.selected) || null; }
  function select(id, focus = true) {
    if (state.selected === id) return;
    const prev = current();
    state.selected = id; state.selEnt = null;
    if (prev) document.querySelector(`.seg[data-id="${prev.id}"]`)?.classList.remove('active');
    const el = document.querySelector(`.seg[data-id="${id}"]`);
    if (el) {
      el.classList.add('active');
      if (prev) refreshSegChrome(prev);
      el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      if (focus) el.querySelector('textarea')?.focus();
    }
    renderSide(); save();
  }
  function autosize(ta) { ta.style.height = 'auto'; ta.style.height = Math.max(72, ta.scrollHeight) + 'px'; }
  function reignLabel(y) {
    y = Number(y);
    if (y >= 1623 && y <= 1649) return `인조 ${y - 1622}년`;
    if (y >= 1777 && y <= 1800) return `정조 ${y - 1776}년`;
    return '';
  }
  function latName(k) { return ({ ner: '인명 인식', link: 'KB 조회', prompt: '조립', llm: 'Gemini', cache: '저장소', total: '합계' })[k] || k; }
  function noteReason(r) { return ({ KB_MISS: 'KB 미등재 인물' })[r] || r || '불확실'; }
  let toastTimer = null;
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 4000);
  }

  // ── 대화상자 ──
  function openImport(sample) {
    const d = $('#dlg-import');
    $('#import-text').value = sample ? SAMPLE.text : '';
    $('#import-year').value = sample ? SAMPLE.year : (current()?.year || '');
    $('#import-append').checked = false;
    $('#import-append').parentElement.hidden = !state.segments.length;
    updateYearHint();
    d.returnValue = '';
    d.showModal();
    $('#import-text').focus();
  }
  function updateYearHint() { $('#import-year-hint').textContent = reignLabel($('#import-year').value); }
  $('#import-year').addEventListener('input', updateYearHint);
  $('#btn-sample').addEventListener('click', () => { $('#import-text').value = SAMPLE.text; $('#import-year').value = SAMPLE.year; updateYearHint(); });
  $('#dlg-import').addEventListener('close', () => {
    if ($('#dlg-import').returnValue !== 'ok') return;
    const parts = splitSource($('#import-text').value);
    if (!parts.length) { toast('불러올 원문이 없습니다.'); return; }
    const year = $('#import-year').value || null;
    const segs = parts.map((p) => newSegment(p, year));
    if ($('#import-append').checked) state.segments.push(...segs);
    else state.segments = segs;
    state.selected = segs[0].id; state.selEnt = null;
    renderAll(); save();
    toast(`${segs.length}개 문단으로 나눴습니다.`);
  });

  function openSettings() {
    $('#set-api').value = keys.api; $('#set-llm').value = keys.llm; $('#set-remember').checked = keys.remember;
    $('#dlg-settings').returnValue = '';
    $('#dlg-settings').showModal();
  }
  $('#btn-settings').addEventListener('click', openSettings);
  $('#btn-forget').addEventListener('click', () => {
    keys = { api: '', llm: '', remember: false }; saveKeys(); renderKeys();
    $('#dlg-settings').close('cancel'); toast('키를 지웠습니다.');
  });
  $('#dlg-settings').addEventListener('close', () => {
    if ($('#dlg-settings').returnValue !== 'ok') return;
    keys = { api: $('#set-api').value.trim(), llm: $('#set-llm').value.trim(), remember: $('#set-remember').checked };
    saveKeys(); renderKeys();
  });

  // ── 내보내기 ──
  function exportRows(onlyReviewed) {
    return state.segments.filter((s) => !onlyReviewed || s.reviewed);
  }
  function download(name, text, type) {
    const blob = new Blob(['﻿' + text], { type });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  $('#btn-export').addEventListener('click', () => { $('#dlg-export').returnValue = ''; $('#dlg-export').showModal(); });
  $('#dlg-export').addEventListener('close', () => {
    if ($('#dlg-export').returnValue !== 'ok') return;
    const fmt = document.querySelector('input[name=fmt]:checked').value;
    const rows = exportRows($('#exp-reviewed').checked);
    if (!rows.length) { toast('내보낼 문단이 없습니다.'); return; }
    const stamp = new Date().toISOString().slice(0, 10);
    const cell = (s) => String(s ?? '').replace(/[\t\r\n]+/g, ' ');
    if (fmt === 'txt') download(`승정원일기_번역_${stamp}.txt`, rows.map((s) => s.out).join('\n\n'), 'text/plain;charset=utf-8');
    else if (fmt === 'pair') download(`승정원일기_대조_${stamp}.txt`, rows.map((s, i) => `[${i + 1}]\n${s.src}\n${s.out}`).join('\n\n'), 'text/plain;charset=utf-8');
    else {
      const head = ['번호', '연도', '원문', '번역', '기계 번역', '직접 수정', '검토 완료', '인명 점검', '확정 인명', '검토할 인명'];
      const body = rows.map((s, i) => {
        const c = check(s);
        return [i + 1, s.year || '', cell(s.src), cell(s.out), cell(s.mt), s.mt && s.out !== s.mt ? 'Y' : '', s.reviewed ? 'Y' : '',
          ({ ok: '반영', review: '검토 필요', lost: '누락' })[c.grade] || '',
          c.confirmed.map((e) => `${e.surface}=${e.resolvedName}`).join('; '),
          [...c.miss, ...c.amb].map((e) => e.surface).join('; ')].join('\t');
      });
      download(`승정원일기_번역표_${stamp}.tsv`, [head.join('\t'), ...body].join('\n'), 'text/tab-separated-values;charset=utf-8');
    }
  });
  $('#btn-copy').addEventListener('click', async () => {
    const text = state.segments.map((s) => s.out).filter(Boolean).join('\n\n');
    if (!text) { toast('복사할 번역문이 없습니다.'); return; }
    try { await navigator.clipboard.writeText(text); toast('번역문을 복사했습니다.'); }
    catch (_) { toast('복사하지 못했습니다. 내보내기를 쓰세요.'); }
  });
  $('#btn-clear').addEventListener('click', () => {
    if (!confirm('지금 작업을 지우고 새로 시작할까요? 내보내지 않은 번역은 사라집니다.')) return;
    state = { segments: [], selected: null, selEnt: null };
    renderAll(); save();
  });

  // ── 이벤트 ──
  $('#btn-import').addEventListener('click', () => openImport(false));
  $('#btn-run').addEventListener('click', runAll);
  $('#btn-stop').addEventListener('click', () => { running?.abort.abort(); });

  $('#segments').addEventListener('click', (ev) => {
    const act = ev.target.closest('[data-act]')?.dataset.act;
    if (act === 'import') return openImport(false);
    if (act === 'sample') return openImport(true);
    const segEl = ev.target.closest('.seg');
    if (!segEl) return;
    const seg = state.segments.find((s) => s.id === segEl.dataset.id);
    if (ev.target.closest('[data-role="run"]')) { select(seg.id, false); runOne(seg); return; }
    const mark = ev.target.closest('mark.ent');
    if (state.selected !== seg.id) select(seg.id, !mark && !ev.target.closest('input,label,button'));
    if (mark) { state.selEnt = mark.dataset.ent; refreshSegChrome(seg); renderSide(); }
  });
  $('#segments').addEventListener('focusin', (ev) => {
    const segEl = ev.target.closest('.seg');
    if (segEl && state.selected !== segEl.dataset.id) select(segEl.dataset.id, false);
  });
  $('#segments').addEventListener('input', (ev) => {
    const segEl = ev.target.closest('.seg');
    if (!segEl) return;
    const seg = state.segments.find((s) => s.id === segEl.dataset.id);
    const role = ev.target.dataset.role;
    if (role === 'out') {
      seg.out = ev.target.value; autosize(ev.target);
      refreshSegChrome(seg); renderSide(); renderProgress();
    } else if (role === 'year') {
      seg.year = ev.target.value || null;
      ev.target.nextElementSibling.textContent = reignLabel(seg.year);
    }
    save();
  });
  $('#segments').addEventListener('change', (ev) => {
    if (ev.target.dataset.role !== 'reviewed') return;
    const seg = state.segments.find((s) => s.id === ev.target.closest('.seg').dataset.id);
    seg.reviewed = ev.target.checked;
    renderProgress(); save();
  });

  $('#ent-panel').addEventListener('mousedown', (ev) => {
    // 「넣기」를 눌러도 textarea 커서를 잃지 않게 포커스 이동을 막는다.
    if (ev.target.closest('[data-act="insert"]')) ev.preventDefault();
  });
  $('#ent-panel').addEventListener('click', (ev) => {
    const seg = current(); if (!seg) return;
    const ins = ev.target.closest('[data-act="insert"]');
    if (ins) {
      const ta = document.querySelector(`.seg[data-id="${seg.id}"] textarea`);
      const name = ins.dataset.name;
      const pos = document.activeElement === ta ? ta.selectionStart : ta.value.length;
      ta.setRangeText(name, pos, document.activeElement === ta ? ta.selectionEnd : pos, 'end');
      ta.focus();
      ta.dispatchEvent(new Event('input', { bubbles: true }));
      return;
    }
    const card = ev.target.closest('.ent-card');
    if (card) { state.selEnt = card.dataset.ent; refreshSegChrome(seg); renderSide(); }
  });
  $('#meta-panel').addEventListener('click', (ev) => {
    if (!ev.target.closest('[data-act="revert"]')) return;
    const seg = current(); if (!seg) return;
    if (!confirm('직접 고친 내용을 버리고 기계 번역으로 되돌릴까요?')) return;
    seg.out = seg.mt; renderSeg(seg); renderSide(); renderProgress(); save();
  });

  document.addEventListener('keydown', (ev) => {
    if (document.querySelector('dialog[open]')) return;
    const seg = current();
    if ((ev.ctrlKey || ev.metaKey) && ev.key === 'Enter' && seg && !running && seg.status !== 'loading') {
      ev.preventDefault(); runOne(seg); return;
    }
    if (ev.altKey && (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') && state.segments.length) {
      ev.preventDefault();
      const i = seg ? state.segments.indexOf(seg) : -1;
      const j = Math.min(state.segments.length - 1, Math.max(0, i + (ev.key === 'ArrowDown' ? 1 : -1)));
      select(state.segments[j].id, true);
    }
  });
  window.addEventListener('resize', () => document.querySelectorAll('.seg textarea').forEach(autosize));

  load();
  if (state.segments.length && !current()) state.selected = state.segments[0].id;
  renderAll();
})();
</script>
</body>
</html>
