# SKALA skala-gj EKS · 네임스페이스 skala-gj4 (ADR-022). kustomize만 — Helm·오퍼레이터 없음 (ADR-012).
# 렌더 확인:  kubectl kustomize deploy/k8s
# 배포 = 커밋: build-push.sh가 이미지를 올린 뒤 아래 images의 newTag를 git short SHA로 바꿔 커밋 → ArgoCD 동기화.
# Secret(sjw-secrets)은 여기 없다 — create-secrets.sh가 로컬 .env로 만든다 (ArgoCD 관리 밖, git에 비밀 없음).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: skala-gj4

# 네임스페이스는 반 전체가 공유한다 — 맨 이름(api·ner·redis·postgres·worker)은 충돌한다.
# 실측(2026-09-28): svc/postgres가 이미 rai 프로젝트 소유여서 생성이 거부됐고, 그 이름은
# 엔드포인트 없는 남의 서비스로 해석돼 api가 DB에 닿지 못한다. 다른 수강생도 전부 접두·접미한다.
# ConfigMap의 호스트명 문자열은 kustomize가 고쳐주지 않으므로 config.yaml에서 직접 맞춰 둔다.
namePrefix: sjw-

labels:
  - pairs:
      app.kubernetes.io/part-of: sjw
    includeSelectors: false

resources:
  - config.yaml
  - postgres.yaml
  - redis.yaml
  - ner.yaml
  - api.yaml
  - worker.yaml
  - ingress.yaml

# 자리표시자는 일부러 존재하지 않는 태그다. latest로 두면 Harbor에 없는데도 정상 태그처럼 보여서
# ImagePullBackOff의 원인이 드러나지 않는다 — 이 값이면 파드 이벤트에 태그명이 그대로 찍혀
# "build-push.sh를 아직 안 돌렸다"가 바로 읽힌다. build-push.sh가 git short SHA로 교체한다.
images:
  - name: sjw-api
    newName: harbor.skala-gj.com/skala-gj4/sjw-api
    newTag: 981bae1
  - name: sjw-worker
    newName: harbor.skala-gj.com/skala-gj4/sjw-worker
    newTag: 981bae1
  - name: sjw-ner
    newName: harbor.skala-gj.com/skala-gj4/sjw-ner
    newTag: 981bae1
