# ArgoCD Application — kustomization 밖에 둔다 (자기 자신을 관리하지 않게).
#
# kubectl로는 적용되지 않는다. 실측(2026-09-28):
#   kubectl auth can-i create applications.argoproj.io  → no  (skala-gj4·argocd 양쪽 모두)
# 수강생 계정의 쿠버네티스 RBAC은 네임스페이스 범위이고, ArgoCD는 그와 별개의 계정 체계를 쓴다.
# 그래서 아래 내용은 ArgoCD CLI나 웹 UI로 등록한다 (자격증명은 과정 안내 PDF):
#   argocd login argocd.skala-gj.com --username skala-gj4
#   argocd app create sjw --project skala-gj4 \
#     --repo https://github.com/dainkil/sjw_traslator.git --path deploy/k8s \
#     --dest-server https://kubernetes.default.svc --dest-namespace skala-gj4 \
#     --sync-policy automated
# project와 dest-namespace는 반드시 skala-gj4여야 한다 (다른 값은 거부된다).
# 이 파일은 그 등록 내용의 정본 기록으로 남긴다.
#
# 순서 주의: kustomization.yaml의 이미지 태그가 Harbor에 실제로 존재한 뒤에 연결한다.
# 먼저 붙이면 automated sync가 없는 태그를 당겨 ImagePullBackOff가 난다.
# 저장소가 비공개면 ArgoCD에 저장소 자격증명 등록이 먼저다 (§5.0 0).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sjw
  namespace: argocd
spec:
  project: skala-gj4
  source:
    repoURL: https://github.com/dainkil/sjw_traslator.git
    targetRevision: main
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: skala-gj4
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
