# 공개 진입점은 이것 하나. BYOK 키가 헤더로 오가므로 처음부터 TLS (cert-manager letsencrypt-prod).
# 발급이 실패하면 tls 블록과 cluster-issuer를 잠시 빼고 HTTP로 먼저 연 뒤 이어서 처리한다 (§5.0).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress   # namePrefix가 붙어 sjw-ingress가 된다
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # SSE(/translations/stream): 버퍼링하면 토큰이 한꺼번에 도착한다. 읽기 타임아웃은 SseEmitter(120s)보다 길게.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "180"
    nginx.ingress.kubernetes.io/proxy-body-size: "64k"   # 요청 본문은 원문 2,000자 상한 (TranslateRequest)
spec:
  ingressClassName: nginx
  tls:
    - hosts: [skala-gj4-sjw.skala-gj.com]
      secretName: sjw-tls
  rules:
    - host: skala-gj4-sjw.skala-gj.com
      http:
        paths:
          # `/api`만 열면 루트가 nginx 404라 공개 주소의 첫 화면이 없다. `/`로 넓혀
          # Swagger UI(/swagger-ui, /v3/api-docs)와 루트 리다이렉트까지 닿게 한다.
          # actuator는 관리 포트(9080)에 있고 Service가 8080만 노출하므로 이 확장으로도 새지 않는다.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
