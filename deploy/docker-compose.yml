# 전 스택 기동 (M2.5 수용 기준 5):  docker compose -f deploy/docker-compose.yml up -d --build
# 인프라만 (로컬 gradle 개발 시):   docker compose -f deploy/docker-compose.yml up -d redis postgres
# 비밀키는 저장소 루트 .env (GEMINI_API_KEY) — 커밋되지 않는다.
services:
  redis:
    image: redis:7-alpine
    container_name: sjw-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:17-alpine
    container_name: sjw-postgres
    environment:
      POSTGRES_DB: sjw
      POSTGRES_USER: sjw
      # 기본값 sjw는 로컬 전용. 바꾸려면 루트 .env에 POSTGRES_PASSWORD — 단, 이미 초기화된 pgdata 볼륨의
      # 비밀번호는 바뀌지 않는다(최초 기동 때만 적용). 볼륨을 새로 만들 때 설정할 것.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sjw}
    ports:
      - "5433:5432"   # 로컬 postgresql@17(5432)과 충돌 방지
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sjw -d sjw"]
      interval: 5s
      timeout: 3s
      retries: 5

  ner:
    build:
      context: ..
      dockerfile: deploy/ner.Dockerfile
    container_name: sjw-ner
    ports:
      - "8100:8100"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8100/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    container_name: sjw-api
    env_file: ../.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sjw
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-sjw}
      SPRING_DATA_REDIS_HOST: redis
      NER_URL: http://ner:8100
      # 교체 축 passthrough — 이것들이 캐시 키를 가른다 (ADR-009). 셸 환경변수로 덮어쓴 뒤
      # 재기동하면 무효화가 도는 것을 눈으로 확인할 수 있다:
      #   NER_MODE=rule docker compose -f deploy/docker-compose.yml up -d api worker
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}   # 활성 모델 — fake-flash-lite면 가짜 provider (quota 0)
      SJW_PUBLIC_MODE: ${SJW_PUBLIC_MODE:-false}      # 공개 모드 리허설: SJW_PUBLIC_MODE=true (§5.0 1-1)
      SJW_LLM_TIMEOUT_MS: ${SJW_LLM_TIMEOUT_MS:-60000}
      NER_MODE: ${NER_MODE:-http}
      KB_MODE: ${KB_MODE:-file}     # noop = 무주입 대조군 (전 멘션 MISS — KB 주입 효과 A/B)
      KB_NAME: ${KB_NAME:-injo}
      CACHE_EPOCH: ${CACHE_EPOCH:-1}
      CACHE_L1_ENABLED: ${CACHE_L1_ENABLED:-true}
      CACHE_L2_ENABLED: ${CACHE_L2_ENABLED:-false}   # M3-S3 템플릿 슬롯 캐시 — opt-in
      ROUTING_ENABLED: ${ROUTING_ENABLED:-false}    # M4 티어 라우팅 — opt-in
      # M3.5-S2 프롬프트 교체 축 + 골든셋 파일 — ../eval이 /eval에 마운트된다 (아래 volumes)
      #   SJW_EVAL_CORPUS=/eval/eval60_stratified.json PROMPT_TEMPLATE=file:/eval/prompts/v1-no-persona.st
      PROMPT_TEMPLATE: ${PROMPT_TEMPLATE:-classpath:prompts/translate-main.st}
      SJW_EVAL_CORPUS: ${SJW_EVAL_CORPUS:-/app/eval/eval300_1925.json}
      # 가짜 provider (GEMINI_MODEL=fake-flash-lite 일 때만 의미) — 429·503·REJECTED 유발 손잡이
      FAKE_RPM: ${FAKE_RPM:-}
      FAKE_RPD: ${FAKE_RPD:-}
      FAKE_LATENCY_MS: ${FAKE_LATENCY_MS:-100}
      FAKE_ERROR_RATE: ${FAKE_ERROR_RATE:-0}
      FAKE_DROP_NAME_RATE: ${FAKE_DROP_NAME_RATE:-0}
      FAKE_SEED: ${FAKE_SEED:-}
    volumes:
      - ../eval:/eval:ro
    ports:
      - "8080:8080"
      - "9080:9080"   # 관리 포트 (actuator: health·metrics·prometheus) — 공개 배포에선 Service에 안 연다
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ner:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
    container_name: sjw-worker
    env_file: ../.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sjw
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-sjw}
      SPRING_DATA_REDIS_HOST: redis
      NER_URL: http://ner:8100
      # 교체 축 passthrough — 이것들이 캐시 키를 가른다 (ADR-009). 셸 환경변수로 덮어쓴 뒤
      # 재기동하면 무효화가 도는 것을 눈으로 확인할 수 있다:
      #   NER_MODE=rule docker compose -f deploy/docker-compose.yml up -d api worker
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}   # 활성 모델 — fake-flash-lite면 가짜 provider (quota 0)
      NER_MODE: ${NER_MODE:-http}
      KB_MODE: ${KB_MODE:-file}     # noop = 무주입 대조군 (전 멘션 MISS — KB 주입 효과 A/B)
      KB_NAME: ${KB_NAME:-injo}
      # 기본은 이미지에 구운 /app/kb. 레포의 kb/를 재빌드 없이 쓰려면 KB_DIR=/kb-local
      # (예: 오프라인 KB 확장 평가 — KB_DIR=/kb-local KB_NAME=injo_aug, eval/kb_mining.py --write-kb)
      KB_DIR: ${KB_DIR:-/app/kb}
      CACHE_EPOCH: ${CACHE_EPOCH:-1}
      CACHE_L1_ENABLED: ${CACHE_L1_ENABLED:-true}
      CACHE_L2_ENABLED: ${CACHE_L2_ENABLED:-false}   # M3-S3 템플릿 슬롯 캐시 — opt-in
      ROUTING_ENABLED: ${ROUTING_ENABLED:-false}    # M4 티어 라우팅 — opt-in
      SJW_LLM_TIMEOUT_MS: ${SJW_LLM_TIMEOUT_MS:-60000}
      PROMPT_TEMPLATE: ${PROMPT_TEMPLATE:-classpath:prompts/translate-main.st}   # M3.5-S2 — 변형은 file:/eval/prompts/*.st
      TIER_UP_ENABLED: ${TIER_UP_ENABLED:-true}     # 품질 승격(REJECTED→3.5-flash). 프롬프트 ablation 중엔 false — 모델을 고정해야 프롬프트 효과만 남는다
      TIER_UP_MODEL: ${TIER_UP_MODEL:-gemini-3.5-flash}   # 승격 목적지 — fake 데모는 fake-flash
      FAKE_RPM: ${FAKE_RPM:-}
      FAKE_RPD: ${FAKE_RPD:-}
      FAKE_LATENCY_MS: ${FAKE_LATENCY_MS:-100}
      FAKE_ERROR_RATE: ${FAKE_ERROR_RATE:-0}
      FAKE_DROP_NAME_RATE: ${FAKE_DROP_NAME_RATE:-0}
      FAKE_SEED: ${FAKE_SEED:-}
    volumes:
      - ../eval:/eval:ro
      - ../kb:/kb-local:ro
    ports:
      - "8081:8081"
      - "9081:9081"   # 관리 포트 (actuator)
    depends_on:
      api:                       # 스키마는 api의 Flyway가 관리 (ADR-023) — api 기동 후에 뜬다
        condition: service_healthy
      ner:
        condition: service_healthy

volumes:
  pgdata:
